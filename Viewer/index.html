<!doctype html>
<meta charset="utf-8">
<title>SCAD 3D</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #f5f5f5; }
  @media (prefers-color-scheme: dark) { body { background: #2a2a2e; } }   /* = scene */
  #canvas { display: block; width: 100%; height: 100%; }
  #status {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 13px -apple-system, system-ui, sans-serif; color: #888;
    pointer-events: none; text-align: center; white-space: pre-line;
  }
  .inspect-label {
    position: absolute; transform: translate(-50%, -50%);
    padding: 2px 7px; border-radius: 5px;
    background: rgba(255, 159, 10, 0.95); color: #1a1a1a;
    font: 600 12px -apple-system, system-ui, sans-serif;
    pointer-events: none; white-space: nowrap;
  }
  .measure-label {
    position: absolute; transform: translate(-50%, -50%);
    padding: 2px 7px; border-radius: 5px;
    background: rgba(255, 77, 109, 0.92); color: #fff;
    font: 600 12px -apple-system, system-ui, sans-serif;
    pointer-events: none; white-space: nowrap;
  }
  /* Command palette */
  #palette {
    position: absolute; inset: 0; z-index: 10;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 12vh; background: rgba(0, 0, 0, 0.35);
  }
  #palette[hidden] { display: none; }
  .palette-box {
    width: min(520px, 82%); overflow: hidden;
    border-radius: 12px; background: rgba(28, 30, 36, 0.86);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), inset 0 0 0 0.5px rgba(255, 255, 255, 0.14);
  }
  .palette-input {
    width: 100%; box-sizing: border-box; border: 0; outline: 0;
    padding: 13px 16px; background: transparent; color: #fff;
    font: 15px -apple-system, system-ui, sans-serif;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.14);
  }
  .palette-list { max-height: 46vh; overflow-y: auto; padding: 6px; }
  .palette-row {
    display: grid; grid-template-columns: 74px 1fr auto; align-items: baseline; gap: 10px;
    width: 100%; appearance: none; border: 0; cursor: pointer; text-align: left;
    padding: 7px 10px; border-radius: 7px; background: transparent;
    font: 13px -apple-system, system-ui, sans-serif; color: rgba(255, 255, 255, 0.92);
  }
  .palette-row.is-active { background: rgba(10, 132, 255, 0.85); }
  .palette-group { color: rgba(255, 255, 255, 0.45); font-size: 11px; text-transform: uppercase; }
  .is-active .palette-group, .is-active .palette-key { color: rgba(255, 255, 255, 0.7); }
  .palette-key { color: rgba(255, 255, 255, 0.4); font-size: 11px; }
  .palette-empty { padding: 12px; color: rgba(255, 255, 255, 0.45);
                   font: 13px -apple-system, system-ui, sans-serif; }
  /* Parts list, top right */
  #parts-tree {
    position: absolute; left: 10px; top: 10px;
    display: flex; flex-direction: column; width: 232px;
    max-height: calc(100% - 76px); overflow: hidden;
    border-radius: 9px; background: rgba(18, 20, 24, 0.62);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
    font: 12px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.9);
  }
  .tree-header {
    display: flex; align-items: center; gap: 6px;
    appearance: none; border: 0; cursor: pointer; width: 100%; text-align: left;
    padding: 8px 10px; background: transparent; color: rgba(255, 255, 255, 0.62);
    font: 600 11px -apple-system, system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tree-body { overflow-y: auto; padding: 0 4px 6px; }
  .tree-row {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 4px; border-radius: 5px;
  }
  .tree-row:hover { background: rgba(255, 255, 255, 0.09); }
  .tree-row.is-off .tree-name { opacity: 0.4; text-decoration: line-through; }
  .tree-row.is-cursor { box-shadow: inset 0 0 0 1.5px rgba(255, 214, 10, 0.9); }
  .tree-row.is-selected { background: rgba(10, 132, 255, 0.85); }
  .tree-row.is-selected:hover { background: rgba(10, 132, 255, 0.95); }
  .tree-row.is-group .tree-name { color: rgba(255, 255, 255, 0.72); font-weight: 600; }
  /* The id is what you match against the model and the readout, so it is always present —
     but quiet, since the name is what you read. */
  .tree-id {
    flex: none; min-width: 26px; font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.35); font-size: 11px;
  }
  .is-selected .tree-id { color: rgba(255, 255, 255, 0.7); }
  .readout-title {
    display: flex; align-items: baseline; gap: 6px;
    font-weight: 600; margin-bottom: 3px;
  }
  .readout-id { color: rgba(255, 255, 255, 0.35); font-weight: 400; font-size: 11px;
                font-variant-numeric: tabular-nums; }
  /* Two columns, so values line up and can be compared down the panel. */
  .readout-table {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
    font-variant-numeric: tabular-nums;
  }
  .readout-key { color: rgba(255, 255, 255, 0.45); }
  .tree-name { flex: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-caret {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    width: 14px; padding: 0; color: rgba(255, 255, 255, 0.45); font-size: 9px;
  }
  /* Always present, so a row does not shift when the pointer arrives. */
  .tree-eye {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    display: flex; align-items: center; padding: 0;
    /* Clear of the scrollbar, so reaching for it does not switch a piece off. */
    margin-right: 10px;
    color: rgba(255, 255, 255, 0.75); opacity: 0;
  }
  .tree-row:hover .tree-eye, .tree-eye.is-off { opacity: 1; }
  .tree-eye.is-off { color: rgba(255, 255, 255, 0.4); }
  #readout {
    /* Bottom right: out of the way of the parts list (top left) and of the model, which sits
       in the middle; it reads like a status field. */
    position: absolute; right: 10px; bottom: 10px; max-width: 260px;
    padding: 6px 11px; border-radius: 8px;
    font: 12px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.92);
    background: rgba(18, 20, 24, 0.55);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
    pointer-events: none;
  }
  /* Nothing to say, nothing to draw — otherwise an empty pill floats there. */
  #readout:empty { display: none; }
  .axis-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 4px 1px 0; vertical-align: middle; }
  .axis-x { background: #d9544d; }
  .axis-y { background: #4c9a52; }
  .axis-z { background: #4a86c8; }
  /* Under the view cube: display (solid / x-ray) and projection, one glass pill each. */
  #view-controls {
    position: absolute; top: 142px; right: 12px; width: 118px;   /* under the 118 px cube */
    display: flex; flex-direction: column; gap: 6px;
    font: 11px -apple-system, system-ui, sans-serif;
  }
  .pill {
    display: flex; gap: 2px; padding: 3px;
    border-radius: 9px; background: rgba(18, 20, 24, 0.62);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
  }
  .pill button {
    flex: 1; appearance: none; border: 0; cursor: default; border-radius: 6px;
    padding: 4px 0; display: grid; place-items: center;
    color: rgba(255, 255, 255, 0.8); background: transparent; font: inherit; font-weight: 500;
  }
  .pill button:hover { background: rgba(255, 255, 255, 0.08); }
  .pill button.is-on { background: #0a84ff; color: white; }
  /* Home, left of the view cube: back to the framing the file opened with. */
  #home {
    position: absolute; top: 12px; right: 138px;      /* cube is 118 wide at 12 from the edge */
    width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center;
    appearance: none; border: 0; cursor: default; border-radius: 8px;
    color: rgba(255, 255, 255, 0.8); background: rgba(18, 20, 24, 0.62);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
  }
  #home:hover { background: rgba(40, 44, 52, 0.75); color: white; }
  #home svg { width: 16px; height: 16px; display: block; }
  /* The tools, floating at the bottom centre: glass like the other panels. */
  #tools {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 4px;
    border-radius: 11px; background: rgba(18, 20, 24, 0.62);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12), 0 6px 20px rgba(0, 0, 0, 0.35);
    font: 12px -apple-system, system-ui, sans-serif;
  }
  .tool-btn {
    appearance: none; border: 0; cursor: default;
    padding: 5px 13px; border-radius: 8px;
    color: rgba(255, 255, 255, 0.85); background: transparent;
    font: inherit; font-weight: 500;
  }
  .tool-btn:hover { background: rgba(255, 255, 255, 0.08); }
  .tool-btn.is-on { background: #0a84ff; color: white; }
</style>
<canvas id="canvas"></canvas>
<div id="status">Rendering mesh…</div>
<div id="readout"></div>
<button id="home" title="Home view — the whole model, from the front-right-above">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2.5 8.2 8 3.2l5.5 5" /><path d="M4 7.6V13h8V7.6" /><path d="M6.8 13V9.8h2.4V13" />

</div>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from './vendor/STLLoader.js';
import { OrbitControls } from './vendor/OrbitControls.js';
import { createMeasure } from './measure.js';
import { createInspect } from './inspect.js';
import { buildPieceModel, pieceFaces, assignTriangles, trianglesInBox, trianglesTouchingBox, cutBoxFromPolygons, triangulateConvex, sphereSilhouette, pieceSilhouette, clippedArea, clipToBox, contactPatches, makeClickDetector, MODEL_TO_WORLD, orientToWorld, modelVector, worldToModelVector } from './picking.js';
import { updateStrokeResolution } from './strokes.js';
import { createGrid } from './grid.js';
import { createPalette } from './palette.js';
import { createTree } from './tree.js';
import { createSection } from './section.js';
import { createViewCube } from './viewcube.js';

const canvas = document.getElementById('canvas');
const status = document.getElementById('status');
const readoutEl = document.getElementById('readout');
/// The details panel: an optional heading in the parts list's own format — name, then id in
/// grey — and the description below it.
function showReadout(text, heading) {
  readoutEl.textContent = '';
  if (heading) {
    const title = document.createElement('div');
    title.className = 'readout-title';
    const name = document.createElement('span');
    name.textContent = heading.name;
    title.appendChild(name);
    if (heading.id !== null && heading.id !== undefined) {
      const id = document.createElement('span');
      id.className = 'readout-id';
      id.textContent = `#${heading.id}`;
      title.appendChild(id);
    }
    readoutEl.appendChild(title);
  }
  // A plain string still works — the section tool writes one line of running text.
  if (typeof text === 'string') {
    const line = document.createElement('div');
    line.textContent = text;
    readoutEl.appendChild(line);
    return;
  }

  const table = document.createElement('div');
  table.className = 'readout-table';
  for (const [label, value] of text ?? []) {
    const key = document.createElement('span');
    key.className = 'readout-key';
    key.textContent = label;
    const val = document.createElement('span');
    // A value may come in pieces, each with the model axis it lies along — a dot in that axis's
    // colour (the grid's) in front of it, so 600 × 400 × 800 reads as x, y, z at a glance.
    if (Array.isArray(value)) {
      value.forEach((part, i) => {
        if (i) val.appendChild(document.createTextNode(' × '));
        if (part.axis) { const dot = document.createElement('span'); dot.className = `axis-dot axis-${part.axis}`; val.appendChild(dot); }
        val.appendChild(document.createTextNode(part.text));
      });
      if (value.unit) val.appendChild(document.createTextNode(' ' + value.unit));
    } else {
      val.textContent = value;
    }
    table.append(key, val);
  }
  readoutEl.appendChild(table);
}

const treeEl = document.getElementById('parts-tree');
const tree = createTree({
  container: treeEl,
  onToggle: setHidden,
  isHidden: (id) => hiddenIds.has(id),
  // The design's own name if it has one, the dimensions otherwise — those at least identify a
  // piece, which a bare number does not. The id is rendered separately, in grey.
  label: (piece) => piece.name ?? piece.size.map((v) => +v.toFixed(1)).join(' × ') + ' mm',
  // Hovering a row shows the piece in the scene. Only the first of a group: highlighting a
  // dozen at once needs machinery the inspect tool does not have, and the point is to find
  // where a row *is*, which one piece answers.
  // The whole group, not just its first piece: pointing at a group asks what it contains.
  onHover: (ids, label) => inspect?.highlightPieces(ids ?? [], label),
  // Selecting from the list needs the tool running, or there is nothing to select *into*.
  onSelect: (id) => { setTool('inspect'); inspect?.selectPiece(id); },
});
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

// `stencil` is not on by default in every context, and the section's cut face is drawn
// through the stencil buffer — without it the model would be hollow where it is cut.
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, stencil: true });
renderer.setPixelRatio(devicePixelRatio);

const scene = new THREE.Scene();
// Dark mode sits a step above the window's own chrome (#1e1e1e), so the model reads as lit rather
// than floating in a void, and the black of a through-hole still contrasts with it.
scene.background = new THREE.Color(dark ? 0x2a2a2e : 0xf5f5f5);
// Two cameras, swapped in place. `view` is handed to the tools so they always read the
// active one rather than a camera captured at construction time.
const perspective = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
const orthographic = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
const view = { camera: orthographic };
let controls = null;

/// 'perspective' or 'isometric' (an orthographic projection: parallel edges stay parallel,
/// so panel thicknesses can be compared across the model without foreshortening).
let projection = 'isometric';

/// Which preset direction the camera is currently on, if any. Declared up here on purpose:
/// makeControls() ends with controls.update(), which fires 'change' synchronously, and the
/// handler below reads this — a `let` further down would be in its temporal dead zone.
let activeView = null;

function makeControls() {
  const target = controls ? controls.target.clone() : new THREE.Vector3();
  controls?.dispose();
  controls = new OrbitControls(view.camera, renderer.domElement);
  // No damping: movement stops the moment the pointer does. Inertia makes it hard to
  // land on a precise angle, which matters when you are inspecting joints.
  controls.enableDamping = false;
  controls.rotateSpeed = 0.65;
  controls.zoomSpeed = 1.5;
  controls.target.copy(target);

  // Rotating away from a preset direction invalidates it; zooming and panning do not,
  // since they leave the direction alone. So compare the direction rather than listening
  // for interaction events.
  controls.addEventListener('change', () => {
    if (!activeView) return;
    const wanted = modelVector(VIEWS[activeView].dir);
    const current = view.camera.position.clone().sub(controls.target).normalize();
    if (current.angleTo(wanted) > 0.5 * Math.PI / 180) {
      activeView = null;
      window.webkit?.messageHandlers?.viewer?.postMessage('view: none');
    }
  });

  // Orbit around what the camera is aimed at, not the middle of the model. Rotating while
  // zoomed into a joint otherwise swings it off screen, because the pivot stays at the scene
  // centre. Re-aimed as a gesture starts, in capture so it lands before OrbitControls reads
  // the drag.
  //
  // The new pivot is picked along the view axis — the ray through the centre of the viewport —
  // so `camera.position - target` keeps its direction and a standard view stays active.
  renderer.domElement.addEventListener('pointerdown', recentrePivot, true);
  // Both gestures come through here, so OrbitControls must not also dolly on the same event.
  controls.enableZoom = false;
  renderer.domElement.addEventListener('wheel', handleWheel, { capture: true, passive: false });

  controls.update();
}

/// Keep the camera where it is, but let the grid and the clip planes follow the new model —
/// an edit can change its size, and planes measured for the old one would clip the new.
///
/// Measured on the parts, not on the scene: the scene holds the grid too, a plane three times
/// the model's radius, so measuring it fed the grid its own size back and it tripled on every
/// reload — "a grid reaching to infinity" after an afternoon of edits.
function refit() {
  const box = new THREE.Box3();
  for (const p of parts) box.expandByObject(p.mesh);
  if (box.isEmpty()) return;
  sceneRadius = Math.max(box.getBoundingSphere(new THREE.Sphere()).radius, 1e-3);
  grid?.fitTo(sceneRadius);
  setClipPlanes(view.camera);
}

/// Near and far for a camera at its current distance from the pivot. An orthographic camera
/// clips nothing on the near side: its image does not depend on where along the view axis it
/// stands, so a negative near costs nothing and spares the model from being cut by a plane
/// whenever the camera has drifted into it.
function setClipPlanes(camera) {
  const distance = camera.position.distanceTo(controls.target);
  const far = distance + sceneRadius * 4;
  camera.near = camera.isOrthographicCamera ? -far : Math.max(0.01, Math.min(distance, sceneRadius) / 100);
  camera.far = far;
  camera.updateProjectionMatrix();
}

/// Zoom, for both gestures, under one law.
///
/// A trackpad pinch arrives as a wheel event with `ctrlKey` set; a two-finger scroll as one
/// without. They were handled differently — pinch here, scroll through OrbitControls — and it
/// showed: OrbitControls takes a *fixed step per event* regardless of how far the fingers moved,
/// so next to a pinch that scales with the gesture, scrolling felt sluggish. Both now scale with
/// deltaY, and only the multiplier differs, because a pinch reports much smaller numbers than a
/// scroll for the same intent.
const PINCH_SPEED = 0.02;      // per unit of deltaY
const SCROLL_SPEED = 0.006;

/// A mouse wheel sends 100+ per notch where a trackpad sends single digits; without a cap one
/// notch would jump most of the way to the model.
const MAX_DELTA = 50;

const pinchState = { last: 0, delta: 0 };

function handleWheel(event) {
  if (!controls) return;
  event.preventDefault();
  event.stopPropagation();

  // Start of a gesture: aim at what is under the cursor, as a drag would.
  const now = performance.now();
  if (now - pinchState.last > 150) recentrePivot();
  pinchState.last = now;
  pinchState.delta = event.deltaY;

  const speed = event.ctrlKey ? PINCH_SPEED : SCROLL_SPEED;
  const delta = Math.max(-MAX_DELTA, Math.min(MAX_DELTA, event.deltaY));
  const factor = Math.exp(delta * speed);
  const camera = view.camera;
  if (camera.isOrthographicCamera) {
    // Orthographic has no distance to change — OrbitControls dollies it by zoom, so match that.
    camera.zoom = Math.max(0.01, Math.min(1000, camera.zoom / factor));
  } else {
    const offset = camera.position.clone().sub(controls.target).multiplyScalar(factor);
    const distance = Math.max(controls.minDistance,
                              Math.min(controls.maxDistance, offset.length()));
    camera.position.copy(controls.target).addScaledVector(offset.normalize(), distance);
  }
  camera.updateProjectionMatrix();
  controls.update();
}

/// Half the model's extent, kept so a camera can be given clip planes that reach it.
let sceneRadius = 1000;

/// Extent of the model in its own axes, for the section to slide within.
let modelBounds = null;

const pivotRay = new THREE.Raycaster();
const pivotCentre = new THREE.Vector2(0, 0);   // NDC centre = the camera's own axis

function recentrePivot() {
  if (!controls || !parts.length) return;
  const distance = view.camera.position.distanceTo(controls.target);

  pivotRay.setFromCamera(pivotCentre, view.camera);
  const hit = pivotRay.intersectObjects(parts.map((p) => p.mesh), false)[0];

  // Nothing under the centre — looking past the model. Keep the orbit radius rather than
  // letting the pivot jump, so the feel does not change when the model leaves the middle.
  controls.target.copy(hit ? hit.point
    : pivotRay.ray.origin.clone().addScaledVector(pivotRay.ray.direction, distance));

  // An orthographic camera keeps its distance too: the pivot is always on a surface in front
  // of the old one, so with the camera left standing the orbit radius only ever shrank, and
  // after an afternoon of re-aiming the camera stood inside the model. Its image does not
  // depend on where along the view axis it is, so moving it back costs nothing to see.
  if (view.camera.isOrthographicCamera) {
    const dir = view.camera.position.clone().sub(controls.target).normalize();
    view.camera.position.copy(controls.target).addScaledVector(dir, distance);
    setClipPlanes(view.camera);
  }
}

/// The first visible part under a pixel, for the tools that cut or aim at a face.
function raycastParts(px) {
  const rect = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2((px.x / rect.width) * 2 - 1, -(px.y / rect.height) * 2 + 1);
  pivotRay.setFromCamera(ndc, view.camera);
  return pivotRay.intersectObjects(parts.filter((p) => p.mesh.visible).map((p) => p.mesh), false)[0] ?? null;
}

makeControls();

const viewCube = createViewCube({
  renderer, canvas, view, controls,
  onAim: (dirModel) => {
    // A face is a standard view with its own up; anything else keeps the model's z up.
    const name = viewNamed(dirModel);
    const up = name ? VIEWS[name].up : [0, 0, 1];
    aimCamera(modelVector(dirModel), modelVector(up), 250);
  },
  onOrbit: orbitBy,
});

function setProjection(kind) {
  const to = kind === 'isometric' ? orthographic : perspective;
  const from = view.camera;
  projection = kind;
  for (const b of document.querySelectorAll('#projection-pill button')) b.classList.toggle('is-on', b.dataset.projection === kind);
  if (to === from) return;

  const direction = from.position.clone().sub(controls.target).normalize();
  const fov = (perspective.fov / 2) * Math.PI / 180;

  // What the outgoing camera framed at the target, so the swap does not jump. Orthographic
  // carries its zoom — pinch changes it — and that has to be undone to get a real height.
  const halfHeight = from.isOrthographicCamera
    ? (from.top - from.bottom) / 2 / from.zoom
    : Math.tan(fov) * from.position.distanceTo(controls.target);
  const distance = halfHeight / Math.tan(fov);

  to.up.copy(from.up);
  to.position.copy(controls.target).addScaledVector(direction, distance);
  to.lookAt(controls.target);

  // Both cameras need clip planes that reach the model. The perspective camera's defaults
  // (0.1 to 1000) are nowhere near a design measured in millimetres, which is why switching to
  // it used to show an empty view: everything sat beyond the far plane.
  if (to.isOrthographicCamera) {
    to.zoom = 1;
    frameOrtho(halfHeight);
  }
  setClipPlanes(to);
  view.camera = to;
  makeControls();
  window.webkit?.messageHandlers?.viewer?.postMessage('projection: ' + kind);
}

/// Standard viewing directions, given in the model's own axes (OpenSCAD is Z-up: +X right,
/// +Y back, +Z up) and rotated into three.js space, so they read the way a joiner expects.
const VIEWS = {
  '3d':    { dir: [0.55, -0.75, 0.42], up: [0, 0, 1] },
  front:   { dir: [0, -1, 0],          up: [0, 0, 1] },
  left:    { dir: [-1, 0, 0],          up: [0, 0, 1] },
  right:   { dir: [1, 0, 0],           up: [0, 0, 1] },
  back:    { dir: [0, 1, 0],           up: [0, 0, 1] },
  top:     { dir: [0, 0, 1],           up: [0, 1, 0] },    // front edge at the bottom, towards the viewer
  bottom:  { dir: [0, 0, -1],          up: [0, 1, 0] },
};

/// Points the camera along a standard direction, keeping the current distance and target so
/// the switch does not also re-zoom. Instant: the view buttons and the tests expect the camera
/// there at once.
function setView(name) {
  const preset = VIEWS[name];
  if (!preset || !controls) return;
  aimCamera(modelVector(preset.dir), modelVector(preset.up), 0);
}

/// The standard view a direction is, if it is one — so a click on the cube's Front face leaves
/// the view buttons showing Front, as the button itself would.
function viewNamed(dirModel) {
  for (const [name, preset] of Object.entries(VIEWS)) {
    if (name === '3d') continue;
    if (new THREE.Vector3(...preset.dir).normalize().dot(dirModel) > 0.9999) return name;
  }
  return null;
}

/// Turns the camera to look along `dir` (world) with `up` (world), keeping distance and target,
/// over `duration` ms — the cube animates so the eye can follow the turn, the buttons do not.
let cameraTween = null;
function aimCamera(dir, up, duration = 250) {
  const camera = view.camera;
  const distance = camera.position.distanceTo(controls.target) || 1;
  const fromDir = camera.position.clone().sub(controls.target).normalize();
  const name = viewNamed(worldToModelVector(dir).normalize());
  const finish = () => {
    activeView = name;               // set before update(), whose 'change' checks it
    camera.up.copy(up);
    camera.position.copy(controls.target).addScaledVector(dir, distance);
    camera.lookAt(controls.target);
    camera.updateProjectionMatrix();
    controls.update();
    window.webkit?.messageHandlers?.viewer?.postMessage('view: ' + (name ?? 'none'));
  };
  if (duration <= 0 || fromDir.angleTo(dir) < 1e-4) { cameraTween = null; finish(); return; }
  const fromUp = camera.up.clone();
  activeView = null;
  cameraTween = {
    start: performance.now(), duration,
    step(t) {
      const k = t * t * (3 - 2 * t);                 // ease in and out
      const d = fromDir.clone().lerp(dir, k).normalize();
      camera.up.copy(fromUp.clone().lerp(up, k).normalize());
      camera.position.copy(controls.target).addScaledVector(d, distance);
      camera.lookAt(controls.target);
      camera.updateProjectionMatrix();
    },
    finish,
  };
}

/// Orbits the camera by a pointer delta, as OrbitControls would for a drag on the model —
/// what a drag on the view cube does.
function orbitBy(dx, dy) {
  const camera = view.camera;
  // About the camera's own up, as OrbitControls does — so a drag on the cube turns the scene
  // exactly as the same drag on the model would, from the top view included.
  const toY = new THREE.Quaternion().setFromUnitVectors(camera.up, new THREE.Vector3(0, 1, 0));
  const offset = camera.position.clone().sub(controls.target).applyQuaternion(toY);
  const spherical = new THREE.Spherical().setFromVector3(offset);
  spherical.theta -= dx * 0.01;
  spherical.phi = Math.max(0.02, Math.min(Math.PI - 0.02, spherical.phi - dy * 0.01));
  offset.setFromSpherical(spherical).applyQuaternion(toY.clone().invert());
  camera.position.copy(controls.target).add(offset);
  camera.lookAt(controls.target);
  controls.update();
  if (activeView) {
    activeView = null;
    window.webkit?.messageHandlers?.viewer?.postMessage('view: none');
  }
}

function frameOrtho(halfHeight) {
  const aspect = canvas.clientWidth / Math.max(canvas.clientHeight, 1);
  orthographic.left = -halfHeight * aspect;
  orthographic.right = halfHeight * aspect;
  orthographic.top = halfHeight;
  orthographic.bottom = -halfHeight;
  orthographic.updateProjectionMatrix();
}

// Lights: one soft from above for volume, two directional for readable edges.
scene.add(new THREE.HemisphereLight(0xffffff, dark ? 0x202020 : 0x9099a5, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(1, 1.4, 1.1);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(-1, 0.4, -0.8);
scene.add(fill);

let parts = [];        // [{ mesh, xray, edges, geometry, rgba }]
let mode = 'normal';
// One switch for edges, because there is now one source for them. There used to be two
// overlays — mesh creases and CSG piece outlines — which showed different sets of lines and
// invited the question of which was right.
let edgesOn = true;
let pieceModel = [];
let edgeLines = null;     // one LineSegments with every piece outline merged in
let measure = null;
let grid = null;
let inspect = null;
// Inspect from the start: the thing you almost always want when a model opens is to point
// at something and be told what it is.
let tool = 'inspect';
let components = [];

// Edges are black in both modes — x-ray keeps the normal background, so there is no
// longer any reason to lighten them.
const EDGE_COLOR = 0x000000;
const EDGE_OPACITY = 0.55;

const MODES = {
  normal: { solid: true,  xray: false },
  xray:   { solid: false, xray: true  },
};

// --- materials ---

/// Material for every line overlay (mesh edges and piece outlines alike).
///
/// Deliberately unbiased. A line lying exactly on its own surface would z-fight, but the
/// cure belongs on the *fill*, not here — `solidMaterial` uses `polygonOffset` to push
/// surfaces back by a depth unit. Biasing the lines forward instead (tried it) breaks real
/// occlusion: with `near = radius/100` and a far plane in the thousands, NDC depth is so
/// non-linear that a small clip-space nudge is worth centimetres in world space, i.e. more
/// than a panel is thick, and hidden edges punch straight through.
function edgeMaterial() {
  return new THREE.LineBasicMaterial({
    color: EDGE_COLOR, transparent: true, opacity: EDGE_OPACITY,
  });
}

/// Materials come from the design's own `color()` calls, recovered from the CSG dump
/// (OpenSCAD drops colour when exporting meshes). Alpha < 1 means real glass in the model.
function solidMaterial(rgba) {
  const [r, g, b, a] = rgba;
  const transparent = a < 0.999;
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(r, g, b),
    roughness: transparent ? 0.1 : 0.55,
    metalness: 0.0,
    transparent,
    opacity: a,
    // Transparent panels must not occlude what is behind them, otherwise draw order
    // decides what you see and glass turns into a grey wall.
    depthWrite: !transparent,
    side: THREE.DoubleSide,      // an OpenSCAD mesh need not be 2-manifold
    // Push the fill one depth unit back so line overlays lying exactly on a surface win,
    // without giving them any advantage over geometry genuinely in front of them. Glass goes
    // one unit further: a translucent block placed against a board shares a plane with it,
    // and with equal offsets the two fought for the pixels frame by frame. Behind by a unit,
    // the board always wins — glass against a wall does not tint the wall.
    polygonOffset: true,
    polygonOffsetFactor: transparent ? 2 : 1,
    polygonOffsetUnits: transparent ? 2 : 1,
  });
}

/// X-ray is the *same* shaded render as solid — same colours, same lighting — only
/// translucent, so you read the structure without losing what the materials are.
/// Alpha is capped rather than scaled: already-transparent glass stays as it is instead of
/// being multiplied into invisibility.
const XRAY_ALPHA_CAP = 0.32;

function xrayMaterial(rgba) {
  const material = solidMaterial(rgba);
  material.transparent = true;
  material.opacity = Math.min(rgba[3], XRAY_ALPHA_CAP);
  // Without this every panel occludes the ones behind it and the view stops being x-ray.
  material.depthWrite = false;
  return material;
}

/// Modes are deliberately data, so another one (wireframe, section) needs no logic changes.
function setMode(name) {
  if (!MODES[name]) return;
  mode = name;
  const m = MODES[name];
  for (const p of parts) {
    p.mesh.visible = m.solid;
    p.xray.visible = m.xray;

  }
  inspect?.setOcclusion(name === 'normal');
  measure?.setOcclusion(name === 'normal');
  for (const b of document.querySelectorAll('#mode-pill button')) b.classList.toggle('is-on', b.dataset.mode === name);
  window.webkit?.messageHandlers?.viewer?.postMessage('mode: ' + name);
}
for (const b of document.querySelectorAll('#mode-pill button')) b.addEventListener('click', () => setMode(b.dataset.mode));
for (const b of document.querySelectorAll('#projection-pill button')) b.addEventListener('click', () => setProjection(b.dataset.projection));
// The pills show the starting state too, not only changes.
for (const b of document.querySelectorAll('#projection-pill button')) b.classList.toggle('is-on', b.dataset.projection === projection);

// Edges are independent of the mode — useful both as a CAD-style overlay on the
// solid view and for reading structure in x-ray.
function setEdges(on) {
  edgesOn = !!on;
  if (edgeLines) edgeLines.visible = edgesOn;
  window.webkit?.messageHandlers?.viewer?.postMessage('edges: ' + edgesOn);
}

/// Tools are mutually exclusive: 'none', 'inspect' or 'measure'.
function setTool(name) {
  tool = name;
  // Disable first: setEnabled(false) clears the readout, which would wipe the hint the
  // incoming tool has just written.
  inspect?.setEnabled(false);
  measure?.setEnabled(false);
  // Stopping the section has to remove its clipping plane from every material. Left behind, it
  // keeps cutting the model after the tool is off, which reads as missing geometry.
  section?.stop();
  if (name === 'inspect') inspect?.setEnabled(true);
  if (name === 'measure') measure?.setEnabled(true);
  if (name === 'section') section?.start();
  for (const b of document.querySelectorAll('#tools .tool-btn')) b.classList.toggle('is-on', b.dataset.tool === name);
  window.webkit?.messageHandlers?.viewer?.postMessage('tool: ' + name);
}
// The tool buttons: either can be switched off again by clicking it, so a click on the active
// one leaves no tool.
for (const b of document.querySelectorAll('#tools .tool-btn')) {
  b.addEventListener('click', () => setTool(tool === b.dataset.tool ? 'none' : b.dataset.tool));
}

// --- camera ---

function fit() {
  const box = new THREE.Box3();
  for (const p of parts) box.expandByObject(p.mesh);
  if (box.isEmpty()) return;

  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const radius = Math.max(sphere.radius, 1e-3);
  sceneRadius = radius;

  const extent = new THREE.Box3().setFromObject(scene);
  const lo = worldToModelVector(extent.min);
  const hi = worldToModelVector(extent.max);
  modelBounds = {
    min: { x: Math.min(lo.x, hi.x), y: Math.min(lo.y, hi.y), z: Math.min(lo.z, hi.z) },
    max: { x: Math.max(lo.x, hi.x), y: Math.max(lo.y, hi.y), z: Math.max(lo.z, hi.z) },
    span: radius * 2,
  };
  section?.setTargets(parts, modelBounds);
  grid?.fitTo(radius);
  // The distance at which the bounding sphere just fits the frame (+8% margin).
  // Framing is defined by the perspective fov even in orthographic, so the two match.
  const distance = radius / Math.tan((perspective.fov / 2) * Math.PI / 180) * 1.08;
  const dir = modelVector(VIEWS['3d'].dir);
  const camera = view.camera;
  camera.position.copy(sphere.center).addScaledVector(dir, distance);
  if (camera.isOrthographicCamera) frameOrtho(radius * 1.08);
  controls.target.copy(sphere.center);
  setClipPlanes(camera);
  controls.maxDistance = distance * 4;
  controls.update();
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  updateStrokeResolution(w, h);
  perspective.aspect = w / Math.max(h, 1);
  perspective.updateProjectionMatrix();
  frameOrtho((orthographic.top - orthographic.bottom) / 2);
}
new ResizeObserver(resize).observe(document.body);
resize();

// --- loading ---

/// Hand the tools the current geometry. Needed after loading and after anything is hidden or
/// brought back, since both tools cache edge lists built from it.
function retarget() {
  measure?.setTargets(pieceModel);
  measure?.setOccluders(parts.map((p) => p.mesh));
  inspect?.setTargets({ parts, pieces: pieceModel });
}

function clearParts() {
  for (const p of parts) {
    scene.remove(p.mesh, p.xray);
    p.geometry.dispose();

  }
  parts = [];
}

function addPart(buffer, rgba) {
  const geometry = new STLLoader().parse(buffer);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, solidMaterial(rgba));
  const xray = new THREE.Mesh(geometry, xrayMaterial(rgba));   // its own material instance

  for (const o of [mesh, xray]) {
    scene.add(orientToWorld(o));
  }

  // `pristine` stands in for the mesh wherever triangles are looked up for hiding: the same
  // placement, but the untouched geometry. The piece caches key on the object they scanned and
  // hold triangle indices into it, so scanning the live mesh after a rebuild would return
  // indices into the reduced geometry and then apply them to the full one.
  const source = geometry.clone();
  parts.push({ mesh, xray, geometry, source, rgba,
               pristine: { geometry: source, matrixWorld: mesh.matrixWorld } });
}

/// Draws the outline of every individual piece.
///
/// The union welds touching panels into one body, so joints between a shelf and a side
/// panel leave no seam in the mesh — and flush faces leave no edge at all. These outlines
/// come from the CSG tree instead, where each piece is still its own box.
/// Drawn exactly like the mesh edges — same black, same opacity, depth-tested — so turning
/// this on simply adds the missing seams to the drawing instead of showing hidden pieces.
/// The one edge overlay: every edge of every visible piece.
///
/// Points are already in world space — buildPieceModel put them there — so this must not be
/// oriented again.
function buildEdgeOverlay(pieces) {
  if (edgeLines) {
    scene.remove(edgeLines);
    edgeLines.geometry.dispose();
    edgeLines = null;
  }
  if (!pieces?.length) return;

  const points = [];
  for (const piece of pieces) points.push(...piece.outline);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  edgeLines = new THREE.LineSegments(geometry, edgeMaterial());
  edgeLines.visible = edgesOn;
  scene.add(edgeLines);
  section?.setOverlays([edgeLines, silhouetteLines]);
  silhouetteCameraKey = '';
}

/// Silhouettes of the spheres, redrawn whenever the camera has moved: a sphere has no edge to
/// put in the overlay above, and what a drawing shows of one is the circle where the view
/// grazes it.
let silhouetteLines = null;
let silhouetteCameraKey = '';
function updateSilhouettes() {
  const spheres = pieceModel;      // any piece may have a cylindrical face
  if (!spheres.length) {
    if (silhouetteLines) { scene.remove(silhouetteLines); silhouetteLines.geometry.dispose(); silhouetteLines = null; }
    return;
  }
  const key = view.camera.matrixWorld.elements.join(',') + view.camera.zoom + (view.camera.isPerspectiveCamera ? 'p' : 'o');
  if (key === silhouetteCameraKey && silhouetteLines) { silhouetteLines.visible = edgesOn; return; }
  silhouetteCameraKey = key;
  const points = [];
  for (const piece of spheres) for (const p of pieceSilhouette(piece, view.camera)) points.push(p.x, p.y, p.z);
  if (!silhouetteLines) {
    silhouetteLines = new THREE.LineSegments(new THREE.BufferGeometry(), edgeMaterial());
    scene.add(silhouetteLines);
    section?.setOverlays([edgeLines, silhouetteLines]);   // so the cut takes the silhouettes too
  }
  silhouetteLines.geometry.dispose();
  silhouetteLines.geometry = new THREE.BufferGeometry();
  silhouetteLines.geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  silhouetteLines.visible = edgesOn;
}

// --- hiding ---

/// Pieces switched off in the parts list. Not a deletion: the mesh is rebuilt from a pristine
/// copy each time, so bringing one back is exact and the .scad file is never touched.
const hiddenIds = new Set();

/// Rebuilds every material mesh without the triangles of its hidden pieces.
///
/// Rebuilding rather than flagging in a shader, because the edge overlay is its own geometry
/// derived from the mesh — a shader that discarded triangles would leave the edges of a hidden
/// piece hanging in the air.
function applyHidden() {
  const dropped = components.filter((c) => hiddenIds.has(c.id));

  for (const part of parts) {
    // Every hidden piece a triangle reaches into. A welded face can span several pieces, so
    // a triangle is not dropped or kept whole: each hidden box is cut out of it in turn and
    // only the remainder — the neighbours' share of that face — is kept.
    const touched = new Map();
    for (const component of dropped) {
      for (const t of trianglesTouchingBox(part.pristine, component)) {
        if (!touched.has(t)) touched.set(t, []);
        touched.get(t).push(component);
      }
    }

    const source = part.source.attributes.position;
    const kept = [];
    for (let t = 0; t < source.count / 3; t++) {
      const cutters = touched.get(t);
      if (!cutters) {
        for (let k = 0; k < 3; k++) {
          const i = (t * 3 + k) * 3;
          kept.push(source.array[i], source.array[i + 1], source.array[i + 2]);
        }
        continue;
      }
      let polygons = [[0, 1, 2].map((k) => new THREE.Vector3().fromBufferAttribute(source, t * 3 + k))];
      for (const component of cutters) {
        polygons = cutBoxFromPolygons(part.pristine, polygons, component);
        if (!polygons.length) break;
      }
      triangulateConvex(polygons, kept);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(kept, 3));
    geometry.computeVertexNormals();

    part.geometry.dispose();
    part.geometry = geometry;
    part.mesh.geometry = geometry;
    part.xray.geometry = geometry;


  }

  // The model, and the overlay built from it, both drop what is hidden.
  pieceModel = buildPieceModel(components.filter((c) => !hiddenIds.has(c.id)));
  buildEdgeOverlay(pieceModel);
  retarget();
  tree?.refresh();
}

/// Switches pieces off or on. Ids rather than triangles, so the same call serves one piece and
/// a whole group, and so a reload can put the list back.
///
/// `only` hides everything else instead — the fastest way to see one piece in a design of
/// sixty. Doing it again brings everything back, since by then the alternative would be to hide
/// what is already hidden.
function setHidden(ids, visible, only = false) {
  if (only) return isolate(ids);
  for (const id of ids) {
    if (visible) hiddenIds.delete(id); else hiddenIds.add(id);
  }
  applyHidden();
}

function isolate(ids) {
  const keep = new Set(ids);
  const alreadyAlone = components.every((c) => keep.has(c.id) !== hiddenIds.has(c.id))
    && hiddenIds.size === components.length - keep.size;

  hiddenIds.clear();
  if (!alreadyAlone) {
    for (const c of components) if (!keep.has(c.id)) hiddenIds.add(c.id);
  }
  applyHidden();
}

/// Hides whatever is selected. Only a part or a whole body: hiding one face of a solid would
/// leave a hole rather than remove a piece.
function hideSelection() {
  const ids = inspect?.selection()?.componentIds ?? [];
  if (!ids.length) return false;
  inspect.clear();
  setHidden(ids, false);
  return true;
}

function restore() {
  hiddenIds.clear();
  applyHidden();
}


window.addEventListener('keydown', (event) => {
  if (event.key !== 'Delete' && event.key !== 'Backspace') return;
  if (palette?.isOpen) return;              // there, Backspace edits the query
  if (hideSelection()) event.preventDefault();
});

/// Single-key shortcuts: V or I Inspect, M Measure, S Section, P the parts list; Escape leaves any
/// other tool for Inspect, the default. Plain keys only — with a modifier they are the app's,
/// and in the palette they are typing.
window.addEventListener('keydown', (event) => {
  if (palette?.isOpen || event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === 'v' || key === 'i') { setTool('inspect'); event.preventDefault(); }
  else if (key === 'm') { setTool('measure'); event.preventDefault(); }
  else if (key === 's') { setTool('section'); event.preventDefault(); }
  else if (key === 'p') { togglePartsList(); event.preventDefault(); }
  // The parts list has the arrows and Enter, unless a section is live — there the arrows move
  // the plane. Escape first takes the list's cursor away, then leaves a tool for Inspect.
  else if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(event.key)) {
    if (section.stage !== 'off' && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) return;
    if (!partsListHidden && tree.key(event)) event.preventDefault();
  }
  else if (event.key === 'Escape') {
    // A step back: the list's cursor first, then a measurement in progress (Measure clears it
    // itself), and only then does the tool give way to Inspect.
    if (!partsListHidden && tree.key(event)) { event.preventDefault(); return; }
    if (tool === 'measure' && measure?.hasPicks) return;
    if (tool !== 'inspect') { setTool('inspect'); event.preventDefault(); }
  }
});

let partsListHidden = false;
function togglePartsList() {
  partsListHidden = !partsListHidden;
  document.getElementById('parts-tree').hidden = partsListHidden;
}

/// Loads either the per-material manifest or, as a fallback, one colourless mesh.
/// Reframing is for opening a file, not for redrawing one that changed while you were looking
/// at it — a save in the editor should leave the camera exactly where you put it.
let framed = false;

async function load() {
  status.textContent = 'Rendering mesh…';
  try {
    clearParts();
    hiddenIds.clear();
    let source = 'materials';
    let manifest = null;
    try {
      manifest = await (await fetch('materials.json')).json();
    } catch {
      manifest = null;
    }

    if (manifest?.parts?.length) {
      for (const [i, part] of manifest.parts.entries()) {
        const buffer = await (await fetch(`part${i}.stl`)).arrayBuffer();
        addPart(buffer, part.color);
      }
    } else {
      source = 'single mesh';
      const buffer = await (await fetch('mesh.stl')).arrayBuffer();
      addPart(buffer, [0.78, 0.78, 0.78, 1]);
    }

    components = manifest?.components ?? [];
    pieceModel = buildPieceModel(components);
    buildEdgeOverlay(pieceModel);
    tree.setComponents(components);

    grid ??= createGrid({ scene });
    setMode(mode);
    setEdges(edgesOn);
    if (!framed) { fit(); framed = true; } else { refit(); }

    measure ??= createMeasure({
      scene, view, renderer,
      readout: (text, heading) => showReadout(text, heading),
    });
    inspect ??= createInspect({
      onSelect: (id) => tree.select(id),
      scene, view, renderer,
      readout: (text, heading) => showReadout(text, heading),
    });
    // Measure picks faces through Inspect's face model, so both tools mean the same face.
    measure.setFacePicker(inspect.faceAt, inspect.faceFill);
    // Only once both tools exist: retarget() feeds them both, and a tool created afterwards
    // would silently never receive its geometry.
    retarget();
    setTool(tool);

    status.textContent = '';
    const triangles = parts.reduce((n, p) => n + p.geometry.attributes.position.count / 3, 0);
    window.webkit?.messageHandlers?.viewer?.postMessage(
      `loaded ${parts.length} part(s), ${triangles} triangles (${source})`);
    window.webkit?.messageHandlers?.viewer?.postMessage(
      `panel: ${Math.round(document.body.clientWidth)}×${Math.round(document.body.clientHeight)}`);
  } catch (e) {
    status.textContent = 'Could not load the mesh:\n' + e;
    window.webkit?.messageHandlers?.viewer?.postMessage('load error: ' + e);
  }
}

/// One step of the camera's turn, by the clock. Called every frame, and by the test snapshot,
/// since a hidden window gets no animation frames.
function advanceCamera(now = performance.now()) {
  if (!cameraTween) return;
  const t = Math.min(1, (now - cameraTween.start) / cameraTween.duration);
  cameraTween.step(t);
  if (t >= 1) { const done = cameraTween; cameraTween = null; done.finish(); }
}

function tick() {
  advanceCamera();
  controls.update();
  updateSilhouettes();
  measure?.update();
  inspect?.update();
  renderer.render(scene, view.camera);
  viewCube?.render();
  requestAnimationFrame(tick);
}
tick();

// --- command palette ---

/// Actions the host owns (Export STL, Reload). Named by the host, because the Quick Look
/// panel has neither, and listing something that cannot run would be worse than not listing it.
let hostActions = [];
const HOST_TITLES = { exportSTL: ['File', 'Export STL…', '⌘E'], reload: ['File', 'Reload', '⌘R'] };

/// Built fresh each time the palette opens, so a toggle can say what it will do rather than
/// what it is — "Hide edges" when they are on.
function paletteActions() {
  const list = [];
  const add = (group, title, run, shortcut) => list.push({ group, title, run, shortcut });

  add('Mode', mode === 'xray' ? 'Solid view' : 'X-ray view',
      () => setMode(mode === 'xray' ? 'normal' : 'xray'));
  add('View', projection === 'isometric' ? 'Perspective projection' : 'Isometric projection',
      () => setProjection(projection === 'isometric' ? 'perspective' : 'isometric'));
  for (const name of Object.keys(VIEWS)) {
    if (name === '3d') continue;
    add('View', name[0].toUpperCase() + name.slice(1) + ' view', () => setView(name));
  }

  add('Overlay', edgesOn ? 'Hide edges' : 'Show edges', () => setEdges(!edgesOn));

  add('Tool', tool === 'inspect' ? 'Stop inspecting' : 'Inspect',
      () => setTool(tool === 'inspect' ? 'none' : 'inspect'));
  add('Tool', tool === 'measure' ? 'Stop measuring' : 'Measure',
      () => setTool(tool === 'measure' ? 'none' : 'measure'));
  add('Tool', tool === 'section' ? 'Stop the cross section' : 'Cross section',
      () => setTool(tool === 'section' ? 'none' : 'section'));
  for (const axis of ['X', 'Y', 'Z']) {
    list.push({ group: 'Section', title: `Cut along ${axis}`,
                run: () => { setTool('section'); section.setAxis(axis.toLowerCase()); },
                enabled: () => true });
  }
  list.push({ group: 'Section', title: 'Flip the kept side', run: () => section.flip(),
              enabled: () => section.stage !== 'off' && section.stage !== 'plane' });

  list.push({ group: 'Selection', title: 'Hide selected piece', shortcut: '⌫',
              run: hideSelection, enabled: () => !!inspect?.selection()?.triangles?.length });
  list.push({ group: 'Selection', title: `Show all hidden (${hiddenIds.size})`,
              run: () => restore(), enabled: () => hiddenIds.size > 0 });
  list.push({ group: 'Selection', title: 'Clear selection',
              run: () => inspect?.clear(), enabled: () => !!inspect?.selection() });

  for (const id of hostActions) {
    const [group, title, shortcut] = HOST_TITLES[id] ?? ['File', id, ''];
    add(group, title, () => window.webkit?.messageHandlers?.viewer?.postMessage('action: ' + id), shortcut);
  }
  return list;
}

let section = createSection({
  scene, renderer, view,
  readout: (text) => { readoutEl.textContent = text; },
});

/// Section keyboard: the plane keeps moving until you switch the tool off.
window.addEventListener('keydown', (event) => {
  if (section.stage === 'off' || palette?.isOpen) return;
  const step = event.shiftKey ? 10 : 1;
  if (event.key === 'ArrowUp') { section.move(step); event.preventDefault(); }
  else if (event.key === 'ArrowDown') { section.move(-step); event.preventDefault(); }
  else if (event.key === 'Tab') { section.flip(); event.preventDefault(); }
  // Escape is handled with the other shortcuts: it leaves the section for Inspect.
});

window.section = section;   // for the palette and for tests

/// Section mouse: a click on a face cuts there. (Orbiting is a drag, and a click is told from
/// it the same way the other tools do.)
makeClickDetector(renderer.domElement, (px) => {
  if (tool !== 'section') return;
  const hit = raycastParts(px);
  if (!hit) return;
  const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  section.setFromHit(normal, hit.point, view.camera.getWorldDirection(new THREE.Vector3()));
});
const palette = createPalette({ actions: paletteActions });

window.setHostActions = (ids) => { hostActions = ids ?? []; };
window.openPalette = () => palette.open();

window.addEventListener('keydown', (event) => {
  if (event.key === 'k' && event.metaKey) { palette.toggle(); event.preventDefault(); }
}, true);

/// The home view: the whole model framed from the front-right-above, as the file opened — the
/// camera only; the model, the hidden pieces and the tools stay as they are.
function homeView() {
  // The framing fit() would choose, reached the way the cube turns the camera: direction, up,
  // distance and target all eased over a quarter of a second, and an orthographic camera's
  // zoom with them.
  const box = new THREE.Box3();
  for (const p of parts) box.expandByObject(p.mesh);
  if (box.isEmpty()) return;
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const radius = Math.max(sphere.radius, 1e-3);
  const distance = radius / Math.tan((perspective.fov / 2) * Math.PI / 180) * 1.08;
  const camera = view.camera;
  const from = {
    dir: camera.position.clone().sub(controls.target).normalize(), up: camera.up.clone(),
    distance: camera.position.distanceTo(controls.target), target: controls.target.clone(),
    zoom: camera.zoom, half: camera.isOrthographicCamera ? (camera.top - camera.bottom) / 2 : 0,
  };
  const to = { dir: modelVector(VIEWS['3d'].dir).normalize(), up: modelVector(VIEWS['3d'].up), distance, target: sphere.center.clone() };
  activeView = null;
  window.webkit?.messageHandlers?.viewer?.postMessage('view: none');
  const apply = (k) => {
    const dir = from.dir.clone().lerp(to.dir, k).normalize();
    controls.target.copy(from.target).lerp(to.target, k);
    camera.up.copy(from.up).lerp(to.up, k).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, from.distance + (to.distance - from.distance) * k);
    if (camera.isOrthographicCamera) {
      // Frame by height: from what it showed to the radius that fits, zoom back to 1.
      const half = from.half / from.zoom + (radius * 1.08 - from.half / from.zoom) * k;
      camera.zoom = 1;
      frameOrtho(half);
    }
    camera.lookAt(controls.target);
    camera.updateProjectionMatrix();
  };
  cameraTween = {
    start: performance.now(), duration: 250,
    step(t) { apply(t * t * (3 - 2 * t)); },
    finish() { apply(1); controls.maxDistance = distance * 4; setClipPlanes(camera); controls.update(); },
  };
}
document.getElementById('home').addEventListener('click', homeView);

/// Back to how the file opened: geometry re-read, hidden pieces back, camera reframed.
window.resetView = () => {
  hiddenIds.clear();
  meshLoaded = false;
  framed = false;              // Cmd-R is the one reload that *should* reframe
  return load();
};

/// Everything a test harness needs, in one namespace — module scope is otherwise invisible
/// from outside. Kept deliberately: each entry is what re-verifies a behaviour the README
/// documents, and hardcoded screen coordinates go stale as the model changes.
window.debug = {
  /// Whole viewer state: mode, projection, overlays, active tool, per-material parts.
  state: () => ({
    mode,
    projection,
    activeView,
    edges: edgesOn,
    pieces: pieceModel.length,
    tool,
    pieceSegments: edgeLines ? edgeLines.geometry.attributes.position.count / 2 : 0,
    parts: parts.map((p) => ({
      rgba: p.rgba,
      triangles: p.geometry.attributes.position.count / 3,
      solid: p.mesh.visible,
      xray: p.xray.visible,
    })),
    status: status.textContent,
    sceneRadius, cameraDistance: view.camera.position.distanceTo(controls.target), near: view.camera.near, far: view.camera.far,
    target: controls.target.toArray().map(Math.round), cameraPos: view.camera.position.toArray().map(Math.round),
    tweening: !!cameraTween,
    panel: [document.body.clientWidth, document.body.clientHeight],
  }),

  /// Camera direction in the model's own axes (Z-up) — checks the view presets.
  cameraDirection: () => {
    const m = worldToModelVector(view.camera.position.clone().sub(controls.target).normalize());
    return [m.x, m.y, m.z].map((v) => Math.round(v * 100) / 100);
  },

  /// Pinch scaling, and the last delta seen — the multiplier can only really be judged
  /// against a real trackpad, so it is adjustable from here.
  zoom: () => ({ pinch: PINCH_SPEED, scroll: SCROLL_SPEED, cap: MAX_DELTA,
                 lastDelta: pinchState.delta }),

  // Camera moves the controls would make, so preset invalidation can be tested: rotating
  // off a preset must clear it, zooming and panning must not.
  zoom: (factor) => {
    const offset = view.camera.position.clone().sub(controls.target).multiplyScalar(factor);
    view.camera.position.copy(controls.target).add(offset);
    controls.update();
  },
  pan: (dx, dy) => {
    controls.target.x += dx; view.camera.position.x += dx;
    controls.target.y += dy; view.camera.position.y += dy;
    controls.update();
  },
  rotate: (radians) => {
    const offset = view.camera.position.clone().sub(controls.target);
    offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), radians);
    view.camera.position.copy(controls.target).add(offset);
    controls.update();
  },

  components: () => components,
  features: () => inspect?.features() ?? [],
  pieceCoverage: () => inspect?.pieceCoverage() ?? null,
  viewCube: () => ({ size: viewCube.size, margin: 12, regionAt: (x, y) => viewCube.regionAt(x, y)?.dir.toArray().map((v) => +v.toFixed(2)) ?? null }),
  refit: () => refit(),
  recentre: () => recentrePivot(),
  /// Diagnostic: the area each plane face of a piece actually has in the mesh (its claimed
  /// triangles), plus its patches — against the face's nominal size.
  faceAreas: (id) => {
    const piece = pieceModel.find((p) => p.id === id);
    if (!piece) return null;
    const faces = pieceFaces(piece);
    const out = new Map();
    const v = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
    for (const part of parts) {
      const groups = assignTriangles(part.mesh, faces, trianglesTouchingBox(part.mesh, piece.source ?? piece));
      const pos = part.mesh.geometry.attributes.position;
      for (const [f, tris] of groups) {
        if (f.kind !== 'plane' || !tris.length) continue;
        const key = f.normal.toArray().map((c) => Math.round(c)).join(',') + '@' + (f.tag ? f.tag.at.toFixed(1) : '?');
        let area = 0;
        for (const t of tris) {
          for (let k = 0; k < 3; k++) v[k].fromBufferAttribute(pos, t * 3 + k).applyMatrix4(part.mesh.matrixWorld);
          area += v[1].clone().sub(v[0]).cross(v[2].clone().sub(v[0])).length() / 2;
        }
        // Clipped to the piece, as the panel measures it, plus the contact patches.
        const soup = clipToBox(part.mesh, tris, piece.source ?? piece, 0.01);
        let clipped = 0;
        for (let i = 0; i + 8 < soup.length; i += 9) {
          const a = new THREE.Vector3(soup[i], soup[i+1], soup[i+2]), b = new THREE.Vector3(soup[i+3], soup[i+4], soup[i+5]), c = new THREE.Vector3(soup[i+6], soup[i+7], soup[i+8]);
          clipped += b.sub(a).cross(c.sub(a)).length() / 2;
        }
        let patched = 0;
        for (const tri of contactPatches(piece, f, pieceModel)) patched += tri[1].clone().sub(tri[0]).cross(tri[2].clone().sub(tri[0])).length() / 2;
        const prev = out.get(key) ?? { raw: 0, clipped: 0, patched: 0 };
        out.set(key, { raw: prev.raw + area, clipped: prev.clipped + clipped, patched: prev.patched + patched });
      }
    }
    return [...out.entries()].map(([k, a]) => `${k} raw ${Math.round(a.raw)} clipped ${Math.round(a.clipped)} patches ${Math.round(a.patched)}`).sort();
  },
  /// Diagnostic: the tagged (box) faces of a piece, and for each the neighbours whose box comes
  /// within a millimetre of its plane — what `contactPatches` has to work with.
  contactsOf: (id) => {
    const piece = pieceModel.find((p) => p.id === id);
    if (!piece) return null;
    const out = [];
    for (const face of pieceFaces(piece)) {
      if (face.kind !== 'plane' || !face.tag) continue;
      const axis = face.tag.axis, at = face.tag.at;
      const atMax = Math.abs(at - piece.box.max[axis]) < 1e-6;
      const near = [];
      const corner = new THREE.Vector3();
      for (const other of pieceModel) {
        if (other === piece) continue;
        const toLocal = new THREE.Matrix4().multiplyMatrices(piece.inverse, other.world);
        const box = new THREE.Box3();
        for (const cx of [other.box.min.x, other.box.max.x]) for (const cy of [other.box.min.y, other.box.max.y]) for (const cz of [other.box.min.z, other.box.max.z]) box.expandByPoint(corner.set(cx, cy, cz).applyMatrix4(toLocal));
        const side = atMax ? box.min[axis] : box.max[axis];
        if (Math.abs(side - at) < 1) {
          const [u, v] = ['x', 'y', 'z'].filter((k) => k !== axis);
          const u0 = Math.max(box.min[u], piece.box.min[u]), u1 = Math.min(box.max[u], piece.box.max[u]);
          const v0 = Math.max(box.min[v], piece.box.min[v]), v1 = Math.min(box.max[v], piece.box.max[v]);
          near.push(`#${other.id} gap=${(side - at).toFixed(3)} overlap=${(u1 - u0).toFixed(1)}x${(v1 - v0).toFixed(1)} sphere=${!!other.sphere}`);
        }
      }
      out.push({ axis, at: +at.toFixed(2), atMax, inward: face.inward, label: face.label, near });
    }
    return out;
  },
  /// Why a triangle (by its world vertices) is refused by each plane face of a piece.
  whyUnclaimed: (id, verts) => {
    const piece = pieceModel.find((p) => p.id === id);
    const faces = pieceFaces(piece);
    const [a, b, c] = verts.map((v) => new THREE.Vector3(...v));
    const normal = b.clone().sub(a).cross(c.clone().sub(a)).normalize();
    return faces.filter((f) => f.kind === 'plane').map((f) => {
      const sign = f.inward ? -1 : 1;
      const dist = Math.max(...[a, b, c].map((p) => Math.abs(p.clone().sub(f.point).dot(f.normal))));
      const into = f.normal.clone().multiplyScalar(f.inward ? 0.25 : -0.25);
      let area = clippedArea(a, b, c, piece.box, piece.inverse, into);
      const cutArea = (piece.cuts ?? []).map((cut) => clippedArea(a, b, c, cut.box, cut.worldToCut, into));
      return { label: f.label, nDot: +(normal.dot(f.normal) * sign).toFixed(3), dist: +dist.toFixed(3), area: +area.toFixed(2), cutArea: cutArea.map((v) => +v.toFixed(2)) };
    }).filter((r) => r.nDot > 0.9);
  },
  /// A sphere's silhouette as currently drawn: segment count and the radius of the ring.
  silhouette: (id) => {
    const piece = pieceModel.find((p) => p.id === id);
    if (!piece) return null;
    const pts = pieceSilhouette(piece, view.camera);
    const c = pts.reduce((acc, p) => acc.add(p), new THREE.Vector3()).divideScalar(pts.length || 1);
    return { segments: pts.length / 2, radius: pts.length ? +pts[0].distanceTo(c).toFixed(2) : 0 };
  },
  /// Triangles wholly inside a piece's box that none of its faces claimed: normal and centroid
  /// relative to the box (0..1 per axis) tell whether they are its own or a neighbour's.
  unclaimed: (id) => {
    const piece = pieceModel.find((p) => p.id === id);
    if (!piece) return null;
    const faces = pieceFaces(piece);
    const out = { faces: faces.map((f) => f.label), perMesh: [], rows: [] };
    for (const part of parts) {
      const inside = trianglesInBox(part.mesh, piece.source ?? piece);
      const groups = assignTriangles(part.mesh, faces, inside);
      const taken = new Set();
      for (const tris of groups.values()) for (const t of tris) taken.add(t);
      out.perMesh.push({ inside: inside.length, taken: taken.size });
      const pos = part.mesh.geometry.attributes.position;
      const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
      const lo = piece.box.min, hi = piece.box.max;
      for (const t of inside) {
        if (taken.has(t)) continue;
        a.fromBufferAttribute(pos, t * 3).applyMatrix4(part.mesh.matrixWorld);
        b.fromBufferAttribute(pos, t * 3 + 1).applyMatrix4(part.mesh.matrixWorld);
        c.fromBufferAttribute(pos, t * 3 + 2).applyMatrix4(part.mesh.matrixWorld);
        const n = b.clone().sub(a).cross(c.clone().sub(a)).normalize();
        const m = a.clone().add(b).add(c).divideScalar(3).applyMatrix4(piece.inverse);
        const rel = m.clone().sub(lo).divide(hi.clone().sub(lo).max(new THREE.Vector3(1e-6, 1e-6, 1e-6)));
        out.rows.push({ mesh: parts.indexOf(part), n: [n.x, n.y, n.z].map((v) => +v.toFixed(2)), at: [rel.x, rel.y, rel.z].map((v) => +v.toFixed(2)),
                       v: [a, b, c].map((q) => [q.x, q.y, q.z].map((v) => +v.toFixed(2))) });
      }
    }
    return out;
  },
  facesOf: (id) => {
    const piece = pieceModel.find((p) => p.id === id);
    if (!piece) return null;
    const faces = pieceFaces(piece);
    // Candidates as the picker uses them; without any, the scan is a different measurement.
    const counts = parts.map((part) => assignTriangles(part.mesh, faces, trianglesTouchingBox(part.mesh, piece.source ?? piece)));
    return faces.map((f, i) => ({
      kind: f.kind, label: f.label, radius: f.radius ? Math.round(f.radius) : undefined,
      inward: f.inward, normal: f.normal ? [f.normal.x, f.normal.y, f.normal.z].map((v) => +v.toFixed(2)) : undefined,
      axis: f.axis ? [f.axis.x, f.axis.y, f.axis.z].map((v) => +v.toFixed(2)) : undefined,
      phi: f.phi ? Object.fromEntries(Object.entries(f.phi).map(([k, v]) => [k, +(v * 180 / Math.PI).toFixed(1)])) : undefined,
      major: f.major, rho: f.rho,
      point: f.point ? [f.point.x, f.point.y, f.point.z].map((v) => +v.toFixed(1)) : undefined,
      triangles: counts.reduce((n, m) => n + (m.get(f)?.length ?? 0), 0),
    }));
  },
  /// World point to canvas pixels, so a test can point where a real cursor would.
  worldToScreen: (w) => {
    const ndc = new THREE.Vector3(w[0], w[1], w[2]).project(view.camera);
    if (Math.abs(ndc.x) > 1 || Math.abs(ndc.y) > 1) return null;
    const r = canvas.getBoundingClientRect();
    return [Math.round((ndc.x * 0.5 + 0.5) * r.width), Math.round((-ndc.y * 0.5 + 0.5) * r.height)];
  },
  snapshot: () => { advanceCamera(); renderer.render(scene, view.camera); viewCube?.render(); return canvas.toDataURL('image/png'); },
  /// Finishes any camera turn in progress, for tests: a hidden window gets no animation frames.
  settleCamera: () => { if (cameraTween) advanceCamera(cameraTween.start + cameraTween.duration); },
  /// Regression check: hover and selection of one piece must paint the same pixels. Measured on
  /// the framebuffer, not on the buffers — the one time they disagreed, the buffers were
  /// identical and the GPU drew fewer segments for hover than it had been given. The hover
  /// stroke is first used on an edge, as it is in real use, before the whole piece.
  highlightParity: (id) => {
    if (!inspect) return null;
    const rect = canvas.getBoundingClientRect();
    const grab = () => {
      renderer.render(scene, view.camera);
      const c = document.createElement('canvas');
      c.width = canvas.width; c.height = canvas.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(canvas, 0, 0);
      return ctx.getImageData(0, 0, c.width, c.height).data;
    };
    const changed = (base, img) => {
      const mask = new Uint8Array(base.length / 4);
      for (let i = 0, k = 0; i < base.length; i += 4, k++) {
        if (Math.abs(base[i] - img[i]) + Math.abs(base[i + 1] - img[i + 1]) + Math.abs(base[i + 2] - img[i + 2]) > 24) mask[k] = 1;
      }
      return mask;
    };
    const event = (px, type, meta) => new PointerEvent(type, {
      clientX: rect.left + px[0], clientY: rect.top + px[1], metaKey: meta, bubbles: true, pointerId: 1,
    });
    const away = [3, 3];
    inspect.clear?.();
    inspect.setFills(false);
    canvas.dispatchEvent(event(away, 'pointermove', false));
    const base = grab();

    // A point on the piece: the centre of the largest face the picker knows for it.
    const piece = pieceModel.find((p) => p.id === id);
    if (!piece) return null;
    const px = (() => {
      const faces = pieceFaces(piece);
      let best = null;
      for (const part of parts) {
        const groups = assignTriangles(part.mesh, faces, trianglesTouchingBox(part.mesh, piece.source ?? piece));
        for (const [f, tris] of groups) if (tris.length && (!best || tris.length > best.tris.length)) best = { mesh: part.mesh, tris };
      }
      if (!best) return null;
      // A triangle's centroid, projected; the first one that lands on screen.
      const pos = best.mesh.geometry.attributes.position;
      const v = new THREE.Vector3();
      for (const t of best.tris) {
        const c = new THREE.Vector3();
        for (let k = 0; k < 3; k++) c.add(v.fromBufferAttribute(pos, t * 3 + k).applyMatrix4(best.mesh.matrixWorld));
        c.divideScalar(3);
        const ndc = c.project(view.camera);
        if (Math.abs(ndc.x) < 0.95 && Math.abs(ndc.y) < 0.95) {
          return [(ndc.x * 0.5 + 0.5) * rect.width, (-ndc.y * 0.5 + 0.5) * rect.height];
        }
      }
      return null;
    })();
    if (!px) return { error: 'no point on screen for piece ' + id };

    // History first: an edge, as the pointer crosses on its way to the piece.
    const edge = inspect.longestFeature?.();
    if (edge?.px) { canvas.dispatchEvent(event(edge.px, 'pointermove', false)); grab(); }

    canvas.dispatchEvent(event(px, 'pointermove', true));
    const hover = changed(base, grab());
    canvas.dispatchEvent(event(px, 'pointerdown', true));
    canvas.dispatchEvent(event(px, 'pointerup', true));
    canvas.dispatchEvent(event(away, 'pointermove', false));
    const select = changed(base, grab());
    inspect.clear?.();
    inspect.setFills(true);

    let h = 0, s = 0, both = 0;
    for (let k = 0; k < hover.length; k++) { h += hover[k]; s += select[k]; both += hover[k] & select[k]; }
    const union = h + s - both;
    return { id, px: px.map(Math.round), hoverPixels: h, selectPixels: s, overlap: union ? +(both / union).toFixed(3) : 1 };
  },
  /// A piece's outline, in world space — straight from the model everything else uses.
  pieceOutline: (id) => pieceModel.find((p) => p.id === id)?.outline ?? [],
  section: () => section.debug,
  // How many of the three materials on each part actually carry the clipping plane — a plane
  // missed on one of them leaves its edges hanging in the cut.
  selectPiece: (id) => { setTool('inspect'); inspect?.selectPiece(id); tree.select(id); },
  hidden: () => [...hiddenIds],
  /// Triangles of the *current* meshes lying wholly inside a model-space box — what is left on
  /// screen in that region after hiding, as opposed to what the pieces claim.
  trianglesWithin: (min, max, slack = 0.01) => {
    let n = 0;
    for (const part of parts) {
      const position = part.mesh.geometry.attributes.position;
      for (let t = 0; t < position.count / 3; t++) {
        let inside = true;
        for (let k = 0; k < 3 && inside; k++) {
          const i = (t * 3 + k) * 3;
          const p = [position.array[i], position.array[i + 1], position.array[i + 2]];
          inside = [0, 1, 2].every((a) => p[a] >= min[a] - slack && p[a] <= max[a] + slack);
        }
        if (inside) n++;
      }
    }
    return n;
  },
  triangles: () => parts.reduce((n, p) => n + p.mesh.geometry.attributes.position.count / 3, 0),
  hide: () => hideSelection(),
  selection: () => inspect?.selection() ?? null,
  restore: () => restore(),
  setHidden: (ids, visible) => setHidden(ids, visible),
  tree: () => document.querySelectorAll('#parts-tree .tree-row').length,

  // Inspect: what is under the cursor, where the modifier path resolves, and a point
  // guaranteed to lie on an arc.
  inspect: () => inspect?.debug() ?? null,
  arcs: () => inspect?.arcs() ?? [],
  ellipses: () => inspect?.ellipses() ?? [],
  patches: (id) => inspect?.patches(id) ?? null,

  // Measure: drives the shelf-pitch check (1150 → 1455 mm must read exactly 305 mm).
  edges: () => measure?.edges() ?? [],
  distance: (i, j) => measure?.distanceBetween(i, j) ?? null,
  select: (i, j) => measure?.select(i, j) ?? 0,
};

load();
</script>
