<!doctype html>
<meta charset="utf-8">
<title>SCAD 3D</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #f5f5f5; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; } }
  #canvas { display: block; width: 100%; height: 100%; }
  #status {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 13px -apple-system, system-ui, sans-serif; color: #888;
    pointer-events: none; text-align: center; white-space: pre-line;
  }
  .inspect-label {
    position: absolute; transform: translate(-50%, -50%);
    padding: 2px 7px; border-radius: 5px;
    background: rgba(255, 159, 10, 0.95); color: #1a1a1a;
    font: 600 12px -apple-system, system-ui, sans-serif;
    pointer-events: none; white-space: nowrap;
  }
  .measure-label {
    position: absolute; transform: translate(-50%, -50%);
    padding: 2px 7px; border-radius: 5px;
    background: rgba(255, 77, 109, 0.92); color: #fff;
    font: 600 12px -apple-system, system-ui, sans-serif;
    pointer-events: none; white-space: nowrap;
  }
  /* Command palette */
  #palette {
    position: absolute; inset: 0; z-index: 10;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 12vh; background: rgba(0, 0, 0, 0.35);
  }
  #palette[hidden] { display: none; }
  .palette-box {
    width: min(520px, 82%); overflow: hidden;
    border-radius: 12px; background: rgba(28, 30, 36, 0.86);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), inset 0 0 0 0.5px rgba(255, 255, 255, 0.14);
  }
  .palette-input {
    width: 100%; box-sizing: border-box; border: 0; outline: 0;
    padding: 13px 16px; background: transparent; color: #fff;
    font: 15px -apple-system, system-ui, sans-serif;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.14);
  }
  .palette-list { max-height: 46vh; overflow-y: auto; padding: 6px; }
  .palette-row {
    display: grid; grid-template-columns: 74px 1fr auto; align-items: baseline; gap: 10px;
    width: 100%; appearance: none; border: 0; cursor: pointer; text-align: left;
    padding: 7px 10px; border-radius: 7px; background: transparent;
    font: 13px -apple-system, system-ui, sans-serif; color: rgba(255, 255, 255, 0.92);
  }
  .palette-row.is-active { background: rgba(10, 132, 255, 0.85); }
  .palette-group { color: rgba(255, 255, 255, 0.45); font-size: 11px; text-transform: uppercase; }
  .is-active .palette-group, .is-active .palette-key { color: rgba(255, 255, 255, 0.7); }
  .palette-key { color: rgba(255, 255, 255, 0.4); font-size: 11px; }
  .palette-empty { padding: 12px; color: rgba(255, 255, 255, 0.45);
                   font: 13px -apple-system, system-ui, sans-serif; }
  /* Parts list, top right */
  #parts-tree {
    position: absolute; left: 10px; top: 10px;
    display: flex; flex-direction: column; width: 232px;
    max-height: calc(100% - 76px); overflow: hidden;
    border-radius: 9px; background: rgba(18, 20, 24, 0.62);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
    font: 12px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.9);
  }
  .tree-header {
    display: flex; align-items: center; gap: 6px;
    appearance: none; border: 0; cursor: pointer; width: 100%; text-align: left;
    padding: 8px 10px; background: transparent; color: rgba(255, 255, 255, 0.62);
    font: 600 11px -apple-system, system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tree-body { overflow-y: auto; padding: 0 4px 6px; }
  .tree-row {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 4px; border-radius: 5px;
  }
  .tree-row:hover { background: rgba(255, 255, 255, 0.09); }
  .tree-row.is-off .tree-name { opacity: 0.4; text-decoration: line-through; }
  .tree-row.is-selected { background: rgba(10, 132, 255, 0.85); }
  .tree-row.is-selected:hover { background: rgba(10, 132, 255, 0.95); }
  .tree-row.is-group .tree-name { color: rgba(255, 255, 255, 0.72); font-weight: 600; }
  /* The id is what you match against the model and the readout, so it is always present —
     but quiet, since the name is what you read. */
  .tree-id {
    flex: none; min-width: 26px; font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.35); font-size: 11px;
  }
  .is-selected .tree-id { color: rgba(255, 255, 255, 0.7); }
  .readout-title {
    display: flex; align-items: baseline; gap: 6px;
    font-weight: 600; margin-bottom: 3px;
  }
  .readout-id { color: rgba(255, 255, 255, 0.35); font-weight: 400; font-size: 11px;
                font-variant-numeric: tabular-nums; }
  /* Two columns, so values line up and can be compared down the panel. */
  .readout-table {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
    font-variant-numeric: tabular-nums;
  }
  .readout-key { color: rgba(255, 255, 255, 0.45); }
  .tree-name { flex: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-caret {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    width: 14px; padding: 0; color: rgba(255, 255, 255, 0.45); font-size: 9px;
  }
  /* Always present, so a row does not shift when the pointer arrives. */
  .tree-eye {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    display: flex; align-items: center; padding: 0;
    /* Clear of the scrollbar, so reaching for it does not switch a piece off. */
    margin-right: 10px;
    color: rgba(255, 255, 255, 0.75); opacity: 0;
  }
  .tree-row:hover .tree-eye, .tree-eye.is-off { opacity: 1; }
  .tree-eye.is-off { color: rgba(255, 255, 255, 0.4); }
  #readout {
    /* Right, opposite the parts list, so the two never overlap. */
    position: absolute; right: 10px; top: 10px; max-width: 260px;
    padding: 6px 11px; border-radius: 8px;
    font: 12px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.92);
    background: rgba(18, 20, 24, 0.55);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
    pointer-events: none;
  }
  /* Nothing to say, nothing to draw — otherwise an empty pill floats there. */
  #readout:empty { display: none; }
</style>
<canvas id="canvas"></canvas>
<div id="status">Rendering mesh…</div>
<div id="readout"></div>
<div id="parts-tree"></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from './vendor/STLLoader.js';
import { OrbitControls } from './vendor/OrbitControls.js';
import { createMeasure } from './measure.js';
import { createInspect } from './inspect.js';
import { pieceOutline, trianglesInBox, MODEL_TO_WORLD, orientToWorld, modelVector, worldToModelVector } from './picking.js';
import { updateStrokeResolution } from './strokes.js';
import { createGrid } from './grid.js';
import { createPalette } from './palette.js';
import { createTree } from './tree.js';
import { createSection } from './section.js';

const canvas = document.getElementById('canvas');
const status = document.getElementById('status');
const readoutEl = document.getElementById('readout');
/// The details panel: an optional heading in the parts list's own format — name, then id in
/// grey — and the description below it.
function showReadout(text, heading) {
  readoutEl.textContent = '';
  if (heading) {
    const title = document.createElement('div');
    title.className = 'readout-title';
    const name = document.createElement('span');
    name.textContent = heading.name;
    title.appendChild(name);
    if (heading.id !== null && heading.id !== undefined) {
      const id = document.createElement('span');
      id.className = 'readout-id';
      id.textContent = `#${heading.id}`;
      title.appendChild(id);
    }
    readoutEl.appendChild(title);
  }
  // A plain string still works — the section tool writes one line of running text.
  if (typeof text === 'string') {
    const line = document.createElement('div');
    line.textContent = text;
    readoutEl.appendChild(line);
    return;
  }

  const table = document.createElement('div');
  table.className = 'readout-table';
  for (const [label, value] of text ?? []) {
    const key = document.createElement('span');
    key.className = 'readout-key';
    key.textContent = label;
    const val = document.createElement('span');
    val.textContent = value;
    table.append(key, val);
  }
  readoutEl.appendChild(table);
}

const treeEl = document.getElementById('parts-tree');
const tree = createTree({
  container: treeEl,
  onToggle: setHidden,
  isHidden: (id) => hiddenIds.has(id),
  // The design's own name if it has one, the dimensions otherwise — those at least identify a
  // piece, which a bare number does not. The id is rendered separately, in grey.
  label: (piece) => piece.name ?? piece.size.map((v) => +v.toFixed(1)).join(' × ') + ' mm',
  // Hovering a row shows the piece in the scene. Only the first of a group: highlighting a
  // dozen at once needs machinery the inspect tool does not have, and the point is to find
  // where a row *is*, which one piece answers.
  // The whole group, not just its first piece: pointing at a group asks what it contains.
  onHover: (ids, label) => inspect?.highlightPieces(ids ?? [], label),
  // Selecting from the list needs the tool running, or there is nothing to select *into*.
  onSelect: (id) => { setTool('inspect'); inspect?.selectPiece(id); },
});
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

// `stencil` is not on by default in every context, and the section's cut face is drawn
// through the stencil buffer — without it the model would be hollow where it is cut.
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, stencil: true });
renderer.setPixelRatio(devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(dark ? 0x1e1e1e : 0xf5f5f5);
// Two cameras, swapped in place. `view` is handed to the tools so they always read the
// active one rather than a camera captured at construction time.
const perspective = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
const orthographic = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
const view = { camera: orthographic };
let controls = null;

/// 'perspective' or 'isometric' (an orthographic projection: parallel edges stay parallel,
/// so panel thicknesses can be compared across the model without foreshortening).
let projection = 'isometric';

/// Which preset direction the camera is currently on, if any. Declared up here on purpose:
/// makeControls() ends with controls.update(), which fires 'change' synchronously, and the
/// handler below reads this — a `let` further down would be in its temporal dead zone.
let activeView = null;

function makeControls() {
  const target = controls ? controls.target.clone() : new THREE.Vector3();
  controls?.dispose();
  controls = new OrbitControls(view.camera, renderer.domElement);
  // No damping: movement stops the moment the pointer does. Inertia makes it hard to
  // land on a precise angle, which matters when you are inspecting joints.
  controls.enableDamping = false;
  controls.rotateSpeed = 0.65;
  controls.zoomSpeed = 1.5;
  controls.target.copy(target);

  // Rotating away from a preset direction invalidates it; zooming and panning do not,
  // since they leave the direction alone. So compare the direction rather than listening
  // for interaction events.
  controls.addEventListener('change', () => {
    if (!activeView) return;
    const wanted = modelVector(VIEWS[activeView].dir);
    const current = view.camera.position.clone().sub(controls.target).normalize();
    if (current.angleTo(wanted) > 0.5 * Math.PI / 180) {
      activeView = null;
      window.webkit?.messageHandlers?.viewer?.postMessage('view: none');
    }
  });

  // Orbit around what the camera is aimed at, not the middle of the model. Rotating while
  // zoomed into a joint otherwise swings it off screen, because the pivot stays at the scene
  // centre. Re-aimed as a gesture starts, in capture so it lands before OrbitControls reads
  // the drag.
  //
  // The new pivot is picked along the view axis — the ray through the centre of the viewport —
  // so `camera.position - target` keeps its direction and a standard view stays active.
  renderer.domElement.addEventListener('pointerdown', recentrePivot, true);
  // Both gestures come through here, so OrbitControls must not also dolly on the same event.
  controls.enableZoom = false;
  renderer.domElement.addEventListener('wheel', handleWheel, { capture: true, passive: false });

  controls.update();
}

/// Keep the camera where it is, but let the grid and the clip planes follow the new model —
/// an edit can change its size, and planes measured for the old one would clip the new.
function refit() {
  const sphere = new THREE.Box3().setFromObject(scene).getBoundingSphere(new THREE.Sphere());
  if (!(sphere.radius > 0)) return;
  sceneRadius = Math.max(sphere.radius, 1e-3);
  grid?.fitTo(sceneRadius);

  const camera = view.camera;
  const distance = camera.position.distanceTo(controls.target);
  camera.near = Math.max(0.01, Math.min(distance, sceneRadius) / 100);
  camera.far = distance + sceneRadius * 4;
  camera.updateProjectionMatrix();
}

/// Zoom, for both gestures, under one law.
///
/// A trackpad pinch arrives as a wheel event with `ctrlKey` set; a two-finger scroll as one
/// without. They were handled differently — pinch here, scroll through OrbitControls — and it
/// showed: OrbitControls takes a *fixed step per event* regardless of how far the fingers moved,
/// so next to a pinch that scales with the gesture, scrolling felt sluggish. Both now scale with
/// deltaY, and only the multiplier differs, because a pinch reports much smaller numbers than a
/// scroll for the same intent.
const PINCH_SPEED = 0.02;      // per unit of deltaY
const SCROLL_SPEED = 0.006;

/// A mouse wheel sends 100+ per notch where a trackpad sends single digits; without a cap one
/// notch would jump most of the way to the model.
const MAX_DELTA = 50;

const pinchState = { last: 0, delta: 0 };

function handleWheel(event) {
  if (!controls) return;
  event.preventDefault();
  event.stopPropagation();

  // Start of a gesture: aim at what is under the cursor, as a drag would.
  const now = performance.now();
  if (now - pinchState.last > 150) recentrePivot();
  pinchState.last = now;
  pinchState.delta = event.deltaY;

  const speed = event.ctrlKey ? PINCH_SPEED : SCROLL_SPEED;
  const delta = Math.max(-MAX_DELTA, Math.min(MAX_DELTA, event.deltaY));
  const factor = Math.exp(delta * speed);
  const camera = view.camera;
  if (camera.isOrthographicCamera) {
    // Orthographic has no distance to change — OrbitControls dollies it by zoom, so match that.
    camera.zoom = Math.max(0.01, Math.min(1000, camera.zoom / factor));
  } else {
    const offset = camera.position.clone().sub(controls.target).multiplyScalar(factor);
    const distance = Math.max(controls.minDistance,
                              Math.min(controls.maxDistance, offset.length()));
    camera.position.copy(controls.target).addScaledVector(offset.normalize(), distance);
  }
  camera.updateProjectionMatrix();
  controls.update();
}

/// Half the model's extent, kept so a camera can be given clip planes that reach it.
let sceneRadius = 1000;

/// Extent of the model in its own axes, for the section to slide within.
let modelBounds = null;

const pivotRay = new THREE.Raycaster();
const pivotCentre = new THREE.Vector2(0, 0);   // NDC centre = the camera's own axis

function recentrePivot() {
  if (!controls || !parts.length) return;
  const distance = view.camera.position.distanceTo(controls.target);

  pivotRay.setFromCamera(pivotCentre, view.camera);
  const hit = pivotRay.intersectObjects(parts.map((p) => p.mesh), false)[0];

  // Nothing under the centre — looking past the model. Keep the orbit radius rather than
  // letting the pivot jump, so the feel does not change when the model leaves the middle.
  controls.target.copy(hit ? hit.point
    : pivotRay.ray.origin.clone().addScaledVector(pivotRay.ray.direction, distance));
}

makeControls();

function setProjection(kind) {
  const to = kind === 'isometric' ? orthographic : perspective;
  const from = view.camera;
  projection = kind;
  if (to === from) return;

  const direction = from.position.clone().sub(controls.target).normalize();
  const fov = (perspective.fov / 2) * Math.PI / 180;

  // What the outgoing camera framed at the target, so the swap does not jump. Orthographic
  // carries its zoom — pinch changes it — and that has to be undone to get a real height.
  const halfHeight = from.isOrthographicCamera
    ? (from.top - from.bottom) / 2 / from.zoom
    : Math.tan(fov) * from.position.distanceTo(controls.target);
  const distance = halfHeight / Math.tan(fov);

  to.up.copy(from.up);
  to.position.copy(controls.target).addScaledVector(direction, distance);
  to.lookAt(controls.target);

  // Both cameras need clip planes that reach the model. The perspective camera's defaults
  // (0.1 to 1000) are nowhere near a design measured in millimetres, which is why switching to
  // it used to show an empty view: everything sat beyond the far plane.
  to.near = Math.max(0.01, Math.min(distance, sceneRadius) / 100);
  to.far = distance + sceneRadius * 4;

  if (to.isOrthographicCamera) {
    to.zoom = 1;
    frameOrtho(halfHeight);
  }
  to.updateProjectionMatrix();
  view.camera = to;
  makeControls();
  window.webkit?.messageHandlers?.viewer?.postMessage('projection: ' + kind);
}

/// Standard viewing directions, given in the model's own axes (OpenSCAD is Z-up: +X right,
/// +Y back, +Z up) and rotated into three.js space, so they read the way a joiner expects.
const VIEWS = {
  '3d':    { dir: [0.55, -0.75, 0.42], up: [0, 0, 1] },
  front:   { dir: [0, -1, 0],          up: [0, 0, 1] },
  left:    { dir: [-1, 0, 0],          up: [0, 0, 1] },
  right:   { dir: [1, 0, 0],           up: [0, 0, 1] },
  back:    { dir: [0, 1, 0],           up: [0, 0, 1] },
  top:     { dir: [0, 0, 1],           up: [0, -1, 0] },   // front edge towards the viewer
  bottom:  { dir: [0, 0, -1],          up: [0, 1, 0] },
};

/// Points the camera along a standard direction, keeping the current distance and target so
/// the switch does not also re-zoom.
function setView(name) {
  const preset = VIEWS[name];
  if (!preset || !controls) return;
  activeView = name;                 // set before update(), whose 'change' checks it
  const camera = view.camera;
  const distance = camera.position.distanceTo(controls.target) || 1;

  camera.up.copy(modelVector(preset.up));
  camera.position.copy(controls.target).addScaledVector(modelVector(preset.dir), distance);
  camera.lookAt(controls.target);
  camera.updateProjectionMatrix();
  controls.update();
  window.webkit?.messageHandlers?.viewer?.postMessage('view: ' + name);
}

function frameOrtho(halfHeight) {
  const aspect = canvas.clientWidth / Math.max(canvas.clientHeight, 1);
  orthographic.left = -halfHeight * aspect;
  orthographic.right = halfHeight * aspect;
  orthographic.top = halfHeight;
  orthographic.bottom = -halfHeight;
  orthographic.updateProjectionMatrix();
}

// Lights: one soft from above for volume, two directional for readable edges.
scene.add(new THREE.HemisphereLight(0xffffff, dark ? 0x202020 : 0x9099a5, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(1, 1.4, 1.1);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(-1, 0.4, -0.8);
scene.add(fill);

let parts = [];        // [{ mesh, xray, edges, geometry, rgba }]
let mode = 'normal';
let edgesOn = true;
let piecesOn = true;
let pieceLines = null;     // one LineSegments with every piece outline merged in
let measure = null;
let grid = null;
let inspect = null;
// Inspect from the start: the thing you almost always want when a model opens is to point
// at something and be told what it is.
let tool = 'inspect';
let components = [];

// Edges are black in both modes — x-ray keeps the normal background, so there is no
// longer any reason to lighten them.
const EDGE_COLOR = 0x000000;
const EDGE_OPACITY = 0.55;

const MODES = {
  normal: { solid: true,  xray: false },
  xray:   { solid: false, xray: true  },
};

// --- materials ---

/// Material for every line overlay (mesh edges and piece outlines alike).
///
/// Deliberately unbiased. A line lying exactly on its own surface would z-fight, but the
/// cure belongs on the *fill*, not here — `solidMaterial` uses `polygonOffset` to push
/// surfaces back by a depth unit. Biasing the lines forward instead (tried it) breaks real
/// occlusion: with `near = radius/100` and a far plane in the thousands, NDC depth is so
/// non-linear that a small clip-space nudge is worth centimetres in world space, i.e. more
/// than a panel is thick, and hidden edges punch straight through.
function edgeMaterial() {
  return new THREE.LineBasicMaterial({
    color: EDGE_COLOR, transparent: true, opacity: EDGE_OPACITY,
  });
}

/// Materials come from the design's own `color()` calls, recovered from the CSG dump
/// (OpenSCAD drops colour when exporting meshes). Alpha < 1 means real glass in the model.
function solidMaterial(rgba) {
  const [r, g, b, a] = rgba;
  const transparent = a < 0.999;
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(r, g, b),
    roughness: transparent ? 0.1 : 0.55,
    metalness: 0.0,
    transparent,
    opacity: a,
    // Transparent panels must not occlude what is behind them, otherwise draw order
    // decides what you see and glass turns into a grey wall.
    depthWrite: !transparent,
    side: THREE.DoubleSide,      // an OpenSCAD mesh need not be 2-manifold
    // Push the fill one depth unit back so line overlays lying exactly on a surface win,
    // without giving them any advantage over geometry genuinely in front of them.
    polygonOffset: true,
    polygonOffsetFactor: 1,
    polygonOffsetUnits: 1,
  });
}

/// X-ray is the *same* shaded render as solid — same colours, same lighting — only
/// translucent, so you read the structure without losing what the materials are.
/// Alpha is capped rather than scaled: already-transparent glass stays as it is instead of
/// being multiplied into invisibility.
const XRAY_ALPHA_CAP = 0.32;

function xrayMaterial(rgba) {
  const material = solidMaterial(rgba);
  material.transparent = true;
  material.opacity = Math.min(rgba[3], XRAY_ALPHA_CAP);
  // Without this every panel occludes the ones behind it and the view stops being x-ray.
  material.depthWrite = false;
  return material;
}

/// Modes are deliberately data, so another one (wireframe, section) needs no logic changes.
function setMode(name) {
  if (!MODES[name]) return;
  mode = name;
  const m = MODES[name];
  for (const p of parts) {
    p.mesh.visible = m.solid;
    p.xray.visible = m.xray;
    p.edges.visible = edgesOn;
  }
  inspect?.setOcclusion(name === 'normal');
  measure?.setOcclusion(name === 'normal');
  window.webkit?.messageHandlers?.viewer?.postMessage('mode: ' + name);
}

// Edges are independent of the mode — useful both as a CAD-style overlay on the
// solid view and for reading structure in x-ray.
function setEdges(on) {
  edgesOn = !!on;
  for (const p of parts) p.edges.visible = edgesOn;
  window.webkit?.messageHandlers?.viewer?.postMessage('edges: ' + edgesOn);
}

/// Tools are mutually exclusive: 'none', 'inspect' or 'measure'.
function setTool(name) {
  tool = name;
  // Disable first: setEnabled(false) clears the readout, which would wipe the hint the
  // incoming tool has just written.
  inspect?.setEnabled(false);
  measure?.setEnabled(false);
  // Stopping the section has to remove its clipping plane from every material. Left behind, it
  // keeps cutting the model after the tool is off, which reads as missing geometry.
  section?.stop();
  if (name === 'inspect') inspect?.setEnabled(true);
  if (name === 'measure') measure?.setEnabled(true);
  if (name === 'section') section?.start();
  window.webkit?.messageHandlers?.viewer?.postMessage('tool: ' + name);
}

// --- camera ---

function fit() {
  const box = new THREE.Box3();
  for (const p of parts) box.expandByObject(p.mesh);
  if (box.isEmpty()) return;

  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const radius = Math.max(sphere.radius, 1e-3);
  sceneRadius = radius;

  const extent = new THREE.Box3().setFromObject(scene);
  const lo = worldToModelVector(extent.min);
  const hi = worldToModelVector(extent.max);
  modelBounds = {
    min: { x: Math.min(lo.x, hi.x), y: Math.min(lo.y, hi.y), z: Math.min(lo.z, hi.z) },
    max: { x: Math.max(lo.x, hi.x), y: Math.max(lo.y, hi.y), z: Math.max(lo.z, hi.z) },
    span: radius * 2,
  };
  section?.setTargets(parts, modelBounds);
  grid?.fitTo(radius);
  // The distance at which the bounding sphere just fits the frame (+8% margin).
  // Framing is defined by the perspective fov even in orthographic, so the two match.
  const distance = radius / Math.tan((perspective.fov / 2) * Math.PI / 180) * 1.08;
  const dir = modelVector(VIEWS['3d'].dir);
  const camera = view.camera;
  camera.near = radius / 100;
  camera.far = distance + radius * 4;
  camera.position.copy(sphere.center).addScaledVector(dir, distance);
  if (camera.isOrthographicCamera) frameOrtho(radius * 1.08);
  camera.updateProjectionMatrix();

  controls.target.copy(sphere.center);
  controls.maxDistance = distance * 4;
  controls.update();
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  updateStrokeResolution(w, h);
  perspective.aspect = w / Math.max(h, 1);
  perspective.updateProjectionMatrix();
  frameOrtho((orthographic.top - orthographic.bottom) / 2);
}
new ResizeObserver(resize).observe(document.body);
resize();

// --- loading ---

/// Hand the tools the current geometry. Needed after loading and after anything is hidden or
/// brought back, since both tools cache edge lists built from it.
function retarget() {
  measure?.setTargets(parts.map((p) => ({ mesh: p.mesh, edgesGeometry: p.edges.geometry })));
  inspect?.setTargets({ parts, components: components.filter((c) => !hiddenIds.has(c.id)) });
}

function clearParts() {
  for (const p of parts) {
    scene.remove(p.mesh, p.xray, p.edges);
    p.geometry.dispose();
    p.edges.geometry.dispose();
  }
  parts = [];
}

function addPart(buffer, rgba) {
  const geometry = new STLLoader().parse(buffer);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, solidMaterial(rgba));
  const xray = new THREE.Mesh(geometry, xrayMaterial(rgba));   // its own material instance
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry, 20),
    edgeMaterial());

  for (const o of [mesh, xray, edges]) {
    scene.add(orientToWorld(o));
  }
  // The pristine geometry is kept: hiding rebuilds from it, so restoring is exact.
  parts.push({ mesh, xray, edges, geometry, source: geometry.clone(), rgba });
}

/// Draws the outline of every individual piece.
///
/// The union welds touching panels into one body, so joints between a shelf and a side
/// panel leave no seam in the mesh — and flush faces leave no edge at all. These outlines
/// come from the CSG tree instead, where each piece is still its own box.
/// Drawn exactly like the mesh edges — same black, same opacity, depth-tested — so turning
/// this on simply adds the missing seams to the drawing instead of showing hidden pieces.
function buildPieces(components) {
  if (pieceLines) {
    scene.remove(pieceLines);
    pieceLines.geometry.dispose();
    pieceLines = null;
  }
  if (!components?.length) return;

  const points = [];
  for (const c of components) {
    const [sx, sy, sz] = c.size;
    if (!(sx > 0 && sy > 0 && sz > 0)) continue;
    points.push(...pieceOutline(c));
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  pieceLines = new THREE.LineSegments(geometry, edgeMaterial());
  orientToWorld(pieceLines);
  pieceLines.visible = piecesOn;
  scene.add(pieceLines);
}

function setPieces(on) {
  piecesOn = !!on;
  if (pieceLines) pieceLines.visible = piecesOn;
  window.webkit?.messageHandlers?.viewer?.postMessage('pieces: ' + piecesOn);
}

// --- hiding ---

/// Pieces switched off in the parts list. Not a deletion: the mesh is rebuilt from a pristine
/// copy each time, so bringing one back is exact and the .scad file is never touched.
const hiddenIds = new Set();

/// Rebuilds every material mesh without the triangles of its hidden pieces.
///
/// Rebuilding rather than flagging in a shader, because the edge overlay is its own geometry
/// derived from the mesh — a shader that discarded triangles would leave the edges of a hidden
/// piece hanging in the air.
function applyHidden() {
  const dropped = components.filter((c) => hiddenIds.has(c.id));

  for (const part of parts) {
    const drop = new Set();
    for (const component of dropped) {
      for (const t of trianglesInBox(part.mesh, component)) drop.add(t);
    }

    const source = part.source.attributes.position;
    const kept = [];
    for (let t = 0; t < source.count / 3; t++) {
      if (drop.has(t)) continue;
      for (let k = 0; k < 3; k++) {
        const i = (t * 3 + k) * 3;
        kept.push(source.array[i], source.array[i + 1], source.array[i + 2]);
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(kept, 3));
    geometry.computeVertexNormals();

    part.geometry.dispose();
    part.geometry = geometry;
    part.mesh.geometry = geometry;
    part.xray.geometry = geometry;

    part.edges.geometry.dispose();
    part.edges.geometry = new THREE.EdgesGeometry(geometry, 20);
  }

  buildPieces(components.filter((c) => !hiddenIds.has(c.id)));
  retarget();
  tree?.refresh();
}

/// Switches pieces off or on. Ids rather than triangles, so the same call serves one piece and
/// a whole group, and so a reload can put the list back.
///
/// `only` hides everything else instead — the fastest way to see one piece in a design of
/// sixty. Doing it again brings everything back, since by then the alternative would be to hide
/// what is already hidden.
function setHidden(ids, visible, only = false) {
  if (only) return isolate(ids);
  for (const id of ids) {
    if (visible) hiddenIds.delete(id); else hiddenIds.add(id);
  }
  applyHidden();
}

function isolate(ids) {
  const keep = new Set(ids);
  const alreadyAlone = components.every((c) => keep.has(c.id) !== hiddenIds.has(c.id))
    && hiddenIds.size === components.length - keep.size;

  hiddenIds.clear();
  if (!alreadyAlone) {
    for (const c of components) if (!keep.has(c.id)) hiddenIds.add(c.id);
  }
  applyHidden();
}

/// Hides whatever is selected. Only a part or a whole body: hiding one face of a solid would
/// leave a hole rather than remove a piece.
function hideSelection() {
  const ids = inspect?.selection()?.componentIds ?? [];
  if (!ids.length) return false;
  inspect.clear();
  setHidden(ids, false);
  return true;
}

function restore() {
  hiddenIds.clear();
  applyHidden();
}


window.addEventListener('keydown', (event) => {
  if (event.key !== 'Delete' && event.key !== 'Backspace') return;
  if (palette?.isOpen) return;              // there, Backspace edits the query
  if (hideSelection()) event.preventDefault();
});

/// Loads either the per-material manifest or, as a fallback, one colourless mesh.
/// Reframing is for opening a file, not for redrawing one that changed while you were looking
/// at it — a save in the editor should leave the camera exactly where you put it.
let framed = false;

async function load() {
  status.textContent = 'Rendering mesh…';
  try {
    clearParts();
    hiddenIds.clear();
    let source = 'materials';
    let manifest = null;
    try {
      manifest = await (await fetch('materials.json')).json();
    } catch {
      manifest = null;
    }

    if (manifest?.parts?.length) {
      for (const [i, part] of manifest.parts.entries()) {
        const buffer = await (await fetch(`part${i}.stl`)).arrayBuffer();
        addPart(buffer, part.color);
      }
    } else {
      source = 'single mesh';
      const buffer = await (await fetch('mesh.stl')).arrayBuffer();
      addPart(buffer, [0.78, 0.78, 0.78, 1]);
    }

    components = manifest?.components ?? [];
    buildPieces(components);
    tree.setComponents(components);

    grid ??= createGrid({ scene });
    setMode(mode);
    setEdges(edgesOn);
    if (!framed) { fit(); framed = true; } else { refit(); }

    measure ??= createMeasure({
      scene, view, renderer,
      readout: (text, heading) => showReadout(text, heading),
    });
    inspect ??= createInspect({
      onSelect: (id) => tree.select(id),
      scene, view, renderer,
      readout: (text, heading) => showReadout(text, heading),
    });
    // Only once both tools exist: retarget() feeds them both, and a tool created afterwards
    // would silently never receive its geometry.
    retarget();
    setTool(tool);

    status.textContent = '';
    const triangles = parts.reduce((n, p) => n + p.geometry.attributes.position.count / 3, 0);
    window.webkit?.messageHandlers?.viewer?.postMessage(
      `loaded ${parts.length} part(s), ${triangles} triangles (${source})`);
    window.webkit?.messageHandlers?.viewer?.postMessage(
      `panel: ${Math.round(document.body.clientWidth)}×${Math.round(document.body.clientHeight)}`);
  } catch (e) {
    status.textContent = 'Could not load the mesh:\n' + e;
    window.webkit?.messageHandlers?.viewer?.postMessage('load error: ' + e);
  }
}

function tick() {
  controls.update();
  measure?.update();
  inspect?.update();
  renderer.render(scene, view.camera);
  requestAnimationFrame(tick);
}
tick();

// The API Swift drives (ScadWebView calls these by name).
window.loadMesh = load;
window.setMode = setMode;
window.setEdges = setEdges;
window.setPieces = setPieces;
window.setTool = setTool;
window.setProjection = setProjection;
window.setView = setView;

// --- command palette ---

/// Actions the host owns (Export STL, Reload). Named by the host, because the Quick Look
/// panel has neither, and listing something that cannot run would be worse than not listing it.
let hostActions = [];
const HOST_TITLES = { exportSTL: ['File', 'Export STL…', '⌘E'], reload: ['File', 'Reload', '⌘R'] };

/// Built fresh each time the palette opens, so a toggle can say what it will do rather than
/// what it is — "Hide edges" when they are on.
function paletteActions() {
  const list = [];
  const add = (group, title, run, shortcut) => list.push({ group, title, run, shortcut });

  add('Mode', mode === 'xray' ? 'Solid view' : 'X-ray view',
      () => setMode(mode === 'xray' ? 'normal' : 'xray'));
  add('View', projection === 'isometric' ? 'Perspective projection' : 'Isometric projection',
      () => setProjection(projection === 'isometric' ? 'perspective' : 'isometric'));
  for (const name of Object.keys(VIEWS)) {
    if (name === '3d') continue;
    add('View', name[0].toUpperCase() + name.slice(1) + ' view', () => setView(name));
  }

  add('Overlay', edgesOn ? 'Hide edges' : 'Show edges', () => setEdges(!edgesOn));
  add('Overlay', piecesOn ? 'Hide parts' : 'Show parts', () => setPieces(!piecesOn));

  add('Tool', tool === 'inspect' ? 'Stop inspecting' : 'Inspect',
      () => setTool(tool === 'inspect' ? 'none' : 'inspect'));
  add('Tool', tool === 'measure' ? 'Stop measuring' : 'Measure',
      () => setTool(tool === 'measure' ? 'none' : 'measure'));
  add('Tool', tool === 'section' ? 'Stop the cross section' : 'Cross section',
      () => setTool(tool === 'section' ? 'none' : 'section'));
  for (const axis of ['X', 'Y', 'Z']) {
    list.push({ group: 'Section', title: `Cut along ${axis}`,
                run: () => { setTool('section'); section.setAxis(axis.toLowerCase()); },
                enabled: () => true });
  }
  list.push({ group: 'Section', title: 'Flip the kept side', run: () => section.flip(),
              enabled: () => section.stage !== 'off' && section.stage !== 'plane' });

  list.push({ group: 'Selection', title: 'Hide selected piece', shortcut: '⌫',
              run: hideSelection, enabled: () => !!inspect?.selection()?.triangles?.length });
  list.push({ group: 'Selection', title: `Show all hidden (${hiddenIds.size})`,
              run: () => restore(), enabled: () => hiddenIds.size > 0 });
  list.push({ group: 'Selection', title: 'Clear selection',
              run: () => inspect?.clear(), enabled: () => !!inspect?.selection() });

  for (const id of hostActions) {
    const [group, title, shortcut] = HOST_TITLES[id] ?? ['File', id, ''];
    add(group, title, () => window.webkit?.messageHandlers?.viewer?.postMessage('action: ' + id), shortcut);
  }
  return list;
}

let section = createSection({
  scene, renderer, view,
  readout: (text) => { readoutEl.textContent = text; },
});

/// Section keyboard: the plane keeps moving until you switch the tool off.
window.addEventListener('keydown', (event) => {
  if (section.stage === 'off' || palette?.isOpen) return;
  const step = event.shiftKey ? 10 : 1;
  if (event.key === 'ArrowUp') { section.move(step); event.preventDefault(); }
  else if (event.key === 'ArrowDown') { section.move(-step); event.preventDefault(); }
  else if (event.key === 'Tab') { section.flip(); event.preventDefault(); }
  else if (event.key === 'Escape') { setTool('none'); event.preventDefault(); }
});

window.section = section;   // for the palette and for tests
const palette = createPalette({ actions: paletteActions });

window.setHostActions = (ids) => { hostActions = ids ?? []; };
window.openPalette = () => palette.open();

window.addEventListener('keydown', (event) => {
  if (event.key === 'k' && event.metaKey) { palette.toggle(); event.preventDefault(); }
}, true);

/// Back to how the file opened: geometry re-read, hidden pieces back, camera reframed.
window.resetView = () => {
  hiddenIds.clear();
  meshLoaded = false;
  framed = false;              // Cmd-R is the one reload that *should* reframe
  return load();
};

/// Everything a test harness needs, in one namespace — module scope is otherwise invisible
/// from outside. Kept deliberately: each entry is what re-verifies a behaviour the README
/// documents, and hardcoded screen coordinates go stale as the model changes.
window.debug = {
  /// Whole viewer state: mode, projection, overlays, active tool, per-material parts.
  state: () => ({
    mode,
    projection,
    activeView,
    edges: edgesOn,
    pieces: piecesOn,
    tool,
    pieceSegments: pieceLines ? pieceLines.geometry.attributes.position.count / 2 : 0,
    parts: parts.map((p) => ({
      rgba: p.rgba,
      triangles: p.geometry.attributes.position.count / 3,
      solid: p.mesh.visible,
      xray: p.xray.visible,
    })),
    status: status.textContent,
    panel: [document.body.clientWidth, document.body.clientHeight],
  }),

  /// Camera direction in the model's own axes (Z-up) — checks the view presets.
  cameraDirection: () => {
    const m = worldToModelVector(view.camera.position.clone().sub(controls.target).normalize());
    return [m.x, m.y, m.z].map((v) => Math.round(v * 100) / 100);
  },

  /// Pinch scaling, and the last delta seen — the multiplier can only really be judged
  /// against a real trackpad, so it is adjustable from here.
  zoom: () => ({ pinch: PINCH_SPEED, scroll: SCROLL_SPEED, cap: MAX_DELTA,
                 lastDelta: pinchState.delta }),

  // Camera moves the controls would make, so preset invalidation can be tested: rotating
  // off a preset must clear it, zooming and panning must not.
  zoom: (factor) => {
    const offset = view.camera.position.clone().sub(controls.target).multiplyScalar(factor);
    view.camera.position.copy(controls.target).add(offset);
    controls.update();
  },
  pan: (dx, dy) => {
    controls.target.x += dx; view.camera.position.x += dx;
    controls.target.y += dy; view.camera.position.y += dy;
    controls.update();
  },
  rotate: (radians) => {
    const offset = view.camera.position.clone().sub(controls.target);
    offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), radians);
    view.camera.position.copy(controls.target).add(offset);
    controls.update();
  },

  components: () => components,
  /// Renders one frame and hands back the pixels. The only way to settle a question about what
  /// is actually drawn rather than what is in the buffers.
  /// Near-white pixels in the rendered frame. The stroke halo is white, so this answers
  /// "is the highlight actually on screen" without a human looking at it.
  /// Screen position of a point along a piece's profile, so a test can crop the image where
  /// the interesting part actually is instead of guessing at offsets.
  profileScreenPoint: (id, t) => {
    const c = components.find((x) => x.id === id);
    if (!c?.profile?.length) return null;
    const p = c.profile[Math.floor(t * (c.profile.length - 1))];
    const world = new THREE.Vector3(p[0], p[1], c.size[2])
      .applyMatrix4(new THREE.Matrix4().set(...c.matrix))
      .applyMatrix4(MODEL_TO_WORLD);
    const ndc = world.project(view.camera);
    return [Math.round((ndc.x * 0.5 + 0.5) * canvas.width),
            Math.round((-ndc.y * 0.5 + 0.5) * canvas.height)];
  },
  countWhite: () => {
    renderer.render(scene, view.camera);
    const off = document.createElement('canvas');
    off.width = canvas.width; off.height = canvas.height;
    const ctx = off.getContext('2d');
    ctx.drawImage(canvas, 0, 0);
    const data = ctx.getImageData(0, 0, off.width, off.height).data;
    let n = 0;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i] > 240 && data[i + 1] > 240 && data[i + 2] > 240) n++;
    }
    return n;
  },
  snapshot: () => { renderer.render(scene, view.camera); return canvas.toDataURL('image/png'); },
  pieceOutline: (id) => {
    const c = components.find((x) => x.id === id);
    return c ? pieceOutline(c) : [];
  },
  section: () => section.debug,
  // How many of the three materials on each part actually carry the clipping plane — a plane
  // missed on one of them leaves its edges hanging in the cut.
  clipCounts: () => parts.map((p) => [p.mesh, p.xray, p.edges]
    .filter((o) => (o.material.clippingPlanes ?? []).length > 0).length),
  selectPiece: (id) => { setTool('inspect'); inspect?.selectPiece(id); tree.select(id); },
  hidden: () => [...hiddenIds],
  hide: () => hideSelection(),
  selection: () => inspect?.selection() ?? null,
  restore: () => restore(),
  setHidden: (ids, visible) => setHidden(ids, visible),
  tree: () => document.querySelectorAll('#parts-tree .tree-row').length,

  // Inspect: what is under the cursor, where the modifier path resolves, and a point
  // guaranteed to lie on an arc.
  inspect: () => inspect?.debug() ?? null,
  arcs: () => inspect?.arcs() ?? [],
  arcPoint: (t) => inspect?.arcPoint(t) ?? null,
  probeModifier: (x, y) => inspect?.probeModifier([x, y]) ?? null,

  // Measure: drives the shelf-pitch check (1150 → 1455 mm must read exactly 305 mm).
  edges: () => measure?.edges() ?? [],
  distance: (i, j) => measure?.distanceBetween(i, j) ?? null,
  select: (i, j) => measure?.select(i, j) ?? 0,
};

load();
</script>
